const link=k=>{let s=DATA.sources[k];return s?`<a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.title)} ↗</a>`:''};
$('channel').innerHTML='<option value="">全部经脉</option>'+Object.values(DATA.meridians).map(m=>`<option value="${m.id}">${esc(m.name)} · ${m.count}</option>`).join('');
function renderResults(){let q=norm($('search').value),channel=$('channel').value;const arr=mode==='point'?Object.values(DATA.points).filter(p=>(!channel||p.meridian===channel)&&(!q||norm(p.name+p.pinyin+p.code).includes(q))):Object.values(DATA.meridians).filter(m=>!q||norm(m.name+m.pinyin+m.id).includes(q));$('count').textContent=arr.length+' 项 · 所有三维坐标仍待配准';$('results').innerHTML=arr.map(p=>{const id=mode==='point'?p.code:p.id;return `<button data-id="${esc(id)}" class="${id===selected?'active':''}"><b>${esc(p.name)}<small>${esc(p.pinyin)}</small></b><span>${esc(id)}</span></button>`}).join('')||'<p class="empty">没有找到匹配条目</p>';$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.id,true));}
function choose(id,scroll=false){selected=id;renderResults();const r=DATA.points[id],m=DATA.meridians[id];if(r){$('detail').innerHTML=`<h2 id="focusHeading" tabindex="-1">${esc(r.name)} <small>${esc(r.pinyin)} · ${esc(r.code)} · ${esc(DATA.meridians[r.meridian].name)}</small></h2><span class="tag">定位状态：未完成本模型体表配准</span><h3>定位依据</h3><p>${esc(r.location)}</p><p class="subtle">${esc(r.locationStatus)}</p><p><strong>需要确认的标志：</strong>${esc(r.requiredLandmarks)}</p><p>${esc(r.anatomyCaution)}</p><div class="source">${link('who')}<br>${link('gb')}${r.sourcePage?`<br>第三方转录所引印刷页 ${r.sourcePage}；本轮未逐页复核原书。`:''}</div><h3>传统名称与意义</h3><p>${esc(r.traditional)}</p><p class="subtle">传统归类与用途、现代临床证据、三维坐标精度分别判断。</p><h3>现代研究如何理解</h3><div class="evidence"><strong>${esc(r.evidenceLevel)}</strong><p>${esc(r.evidence)}</p></div><p class="source">${r.evidenceSources.map(link).join('<br>')}</p><h3>本模型的定位审核</h3><div class="audit"><div>皮肤/体表配准</div><div>未完成</div><div>逐穴专业复核</div><div>未完成</div><div>实测定位误差</div><div>未知，不应填“0毫米”</div><div>原有三维位置</div><div>人工导航示意，不是WHO发布的坐标</div></div><div class="actions"><button id="prev">上一穴</button><button id="next">下一穴</button><button id="showMeridian">了解${esc(DATA.meridians[r.meridian].short)}</button></div><p class="subtle">本资料不提供针刺操作或个体化治疗建议，不能凭模型取穴。</p>`;let siblings=Object.values(DATA.points).filter(p=>p.meridian===r.meridian),index=siblings.findIndex(p=>p.code===id);$('prev').onclick=()=>choose(siblings[(index-1+siblings.length)%siblings.length].code,true);$('next').onclick=()=>choose(siblings[(index+1)%siblings.length].code,true);$('showMeridian').onclick=()=>{setMode('meridian');choose(r.meridian,true)};
}else if(m){$('detail').innerHTML=`<h2 id="focusHeading" tabindex="-1">${esc(m.name)}<small>${esc(m.pinyin)} · ${m.id} · ${m.count}个名称</small></h2><span class="tag">传统经脉导览，不是已解剖出的同名神经</span><h3>名称与传统分类</h3><p>${esc(m.meaning)}</p>${m.paired?`<p>传统表里配对：${esc(DATA.meridians[m.paired].name)}。这一配对不是现代神经解剖关系。</p>`:''}<h3>当前三维导览的范围</h3><p>${esc(m.regions)}</p><p>${esc(m.coverage)}</p><h3>现代解读</h3><p>${esc(m.modern)}</p><p class="source">${m.sourceKeys.map(link).join('<br>')}</p><div class="actions"><button id="backPoints">查看这条经脉的穴名目录</button></div>`;$('backPoints').onclick=()=>{setMode('point');$('channel').value=id;renderResults();choose(Object.values(DATA.points).find(p=>p.meridian===id).code,true)};}if(scroll)$('focusHeading').scrollIntoView({behavior:'smooth',block:'start'});}
function setMode(m){mode=m;$('pointTab').classList.toggle('active',m==='point');$('meridianTab').classList.toggle('active',m==='meridian');$('channel').hidden=m!=='point';$('search').value='';$('channel').value='';renderResults();}
$('pointTab').onclick=()=>{setMode('point');choose('PC6')};$('meridianTab').onclick=()=>{setMode('meridian');choose('KI')};$('search').oninput=renderResults;$('channel').onchange=renderResults;
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{setMode('point');choose(b.dataset.topic,true)});$('allSources').innerHTML=Object.keys(DATA.sources).map(link).join('<br>');choose('PC6');
window.__EVIDENCE_PAGE__={getState:()=>({mode,selected,points:Object.keys(DATA.points).length,meridians:Object.keys(DATA.meridians).length,verifiedCoordinates:0}),choose,DATA};
</script></html>
