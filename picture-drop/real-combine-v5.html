*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:#030a17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}button,a{font:inherit}.app-shell{position:relative;min-height:100svh;max-width:520px;margin:auto;padding:calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 15px);overflow:hidden;background:radial-gradient(circle at 10% 8%,rgba(58,210,255,.2),transparent 29%),radial-gradient(circle at 88% 45%,rgba(255,169,71,.16),transparent 30%),linear-gradient(180deg,#12345a,#07172e 38%,#040914)}.ambient{position:absolute;border-radius:50%;filter:blur(70px);opacity:.25;pointer-events:none}.ambient-one{width:260px;height:260px;background:#1edcff;left:-190px;top:26%}.ambient-two{width:260px;height:260px;background:#ff9e48;right:-200px;bottom:8%}
.topbar{position:relative;z-index:5;height:64px;display:grid;grid-template-columns:46px 1fr 52px;align-items:center;gap:7px}.back-btn,.tool-btn{height:40px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(5,25,50,.72);color:#fff;display:grid;place-items:center;text-decoration:none;box-shadow:inset 0 1px rgba(255,255,255,.12),0 5px 16px rgba(0,0,0,.22)}.back-btn{font-size:35px;line-height:1}.tool-btn{font-size:12px;font-weight:900}.stage-copy{text-align:center;min-width:0}.stage-copy small{display:block;color:#74e8ff;font-weight:900;letter-spacing:.08em;font-size:10px}.stage-copy strong{display:block;margin-top:2px;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.game-card{margin-top:10px;border-radius:20px;padding:8px}.deck-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px 7px}.deck-title{display:flex;align-items:baseline;gap:7px}.deck-title small{color:#a9cbe4}.deck-title b{color:#ffe076;font-size:14px}.deck-preview{display:flex;gap:4px;height:34px}.deck-preview i{display:block;width:25px;border-radius:5px;background-position:center;background-size:cover;border:1px solid rgba(255,255,255,.6);box-shadow:0 3px 7px rgba(0,0,0,.25)}.canvas-shell{position:relative;border-radius:17px;overflow:hidden;background:linear-gradient(180deg,rgba(63,143,194,.28),rgba(2,12,28,.92));box-shadow:inset 0 0 0 1px rgba(122,220,255,.25),0 14px 30px rgba(0,0,0,.3)}#gameCanvas{display:block;width:100%;height:min(58svh,610px);touch-action:none}.snap-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);padding:7px 13px;border-radius:99px;background:rgba(255,218,89,.94);color:#523700;font-weight:1000;opacity:0;pointer-events:none;box-shadow:0 0 30px rgba(255,215,80,.8)}.snap-badge.show{animation:snapBadge .55s ease}@keyframes snapBadge{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}.status-row{display:flex;justify-content:space-between;gap:8px;padding:8px 3px 2px;color:#a9c8df;font-size:10px;line-height:1.4}.status-row span{max-width:82%}.status-row b{color:#ffe184;white-space:nowrap}

.toast{position:fixed;z-index:200;left:50%;bottom:calc(var(--safe-bottom) + 86px);transform:translate(-50%,14px);padding:8px 13px;border-radius:99px;background:rgba(2,13,30,.9);color:#fff;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}.toast.is-visible{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;z-index:300;inset:0;display:grid;place-items:center;align-content:center;gap:13px;background:#07152a;transition:.35s}.loading.is-hidden{opacity:0;pointer-events:none}.loading i{width:42px;height:42px;border:4px solid rgba(255,255,255,.14);border-top-color:#6ce8ff;border-radius:50%;animation:spin .75s linear infinite}.loading span{color:#c4dceb;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function easeOutCubic(t){return 1-Math.pow(1-t,3);}

function sound(type='tap',level=1){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const now=audioCtx.currentTime;

  const r=els.map.getBoundingClientRect(),w=r.width,h=r.height;if(!w||!h||!img.complete)return;
  mapCtx.clearRect(0,0,w,h);drawFull(mapCtx,{x:0,y:0,w,h},.2);
  for(let m=0;m<16;m++){const rr={x:(m%4)*w/4,y:Math.floor(m/4)*h/4,w:w/4,h:h/4};if(state.stage===2||state.collected.has(m))drawMacro(mapCtx,m,rr,1);else{mapCtx.fillStyle='rgba(3,12,26,.62)';mapCtx.fillRect(rr.x,rr.y,rr.w,rr.h);}mapCtx.strokeStyle='rgba(255,255,255,.26)';mapCtx.lineWidth=1;mapCtx.strokeRect(rr.x+.5,rr.y+.5,rr.w-1,rr.h-1);}
  if(state.stage===1){mapCtx.fillStyle='rgba(255,229,119,.95)';mapCtx.font='700 11px sans-serif';mapCtx.fillText(`${state.collected.size}/16`,8,h-8);}
}
function updateDeckPreview(){
  els.deckPreview.innerHTML='';const next=[];
  for(let c=0;c<state.cols;c++){const id=state.decks[c]?.[0];if(id)next.push(id);}
  next.slice(0,5).forEach(id=>{const cv=document.createElement('canvas');cv.width=50;cv.height=66;const c=cv.getContext('2d');c.imageSmoothingQuality='medium';drawCrop(c,state.defs.get(id),{x:0,y:0,w:50,h:66});els.deckPreview.appendChild(cv);});
}
function syncUI(){
  if(state.stage===1){
    els.kicker.textContent='第一阶段 · 小图消除';els.title.textContent='4块拼成局部实景';els.goalLabel.textContent=`第${state.wave+1}/4波 · 本波区域分散在大图不同位置`;els.goalValue.textContent=`${state.collected.size} / 16`;els.deckTitle.textContent='待发细碎片';els.quick.textContent='直接体验大图阶段';els.message.textContent='拖动可交换；已吸附组合可整体拖，长按300ms可拆单块。';els.progress.style.width=(state.collected.size/16*100)+'%';
  }else{
    els.kicker.textContent='第二阶段 · 大图合成';els.title.textContent='16张局部拼成完整实景';const n=largestGroup();els.goalLabel.textContent='局部小图重新发牌并下落';els.goalValue.textContent=`最大组合 ${n} / 16`;els.deckTitle.textContent='待发局部小图';els.quick.textContent='自动演示完成';els.message.textContent='局部图正确相邻会无缝吸附；组合也能整体移动。';els.progress.style.width=(n/16*100)+'%';
  }
  els.deckCount.textContent=String(remainingDeck());els.moves.textContent=`${state.moves[state.stage-1]}步`;drawMap();updateDeckPreview();
}
function drawTransition(){
  const r=els.transitionCanvas.getBoundingClientRect(),p=Math.min(1.75,devicePixelRatio||1);els.transitionCanvas.width=Math.round(r.width*p);els.transitionCanvas.height=Math.round(r.height*p);transCtx.setTransform(p,0,0,p,0,0);transCtx.imageSmoothingQuality='medium';drawFull(transCtx,{x:0,y:0,w:r.width,h:r.height},1);transCtx.strokeStyle='rgba(255,255,255,.62)';for(let i=1;i<4;i++){transCtx.beginPath();transCtx.moveTo(i*r.width/4,0);transCtx.lineTo(i*r.width/4,r.height);transCtx.stroke();transCtx.beginPath();transCtx.moveTo(0,i*r.height/4);transCtx.lineTo(r.width,i*r.height/4);transCtx.stroke();}
}

function findHint(){
  const beforeComplete=state.stage===1?stage1Completes().length:0,beforeLargest=state.stage===2?largestGroup():0;let best=null;
  for(const group of state.cache.groups){for(const anchorId of group.ids){for(let cell=0;cell<state.board.length;cell++){
    const p=translatedMove(group,anchorId,cell);if(!p)continue;
    const score=p.completeGain*10000+p.largestGain*1200+p.added*650-(Math.abs(p.dr)+Math.abs(p.dc));
    if(!best||score>best.score)best={...p,score};
  }}}
  return best&&best.score>0?best:null;
}
function rescueShuffle(){
  const ids=state.board.filter(Boolean),empties=state.board.length-ids.length;
  for(let attempt=0;attempt<120;attempt++){
    const mixed=shuffle(ids.slice(),700000+attempt+state.wave*191+state.stage*1000),board=mixed.concat(Array(empties).fill(null));
    // Put empties near the top so gravity remains understandable.
    const columns=Array.from({length:state.cols},()=>[]);board.filter(Boolean).forEach((id,i)=>columns[i%state.cols].push(id));
    const candidate=Array(state.rows*state.cols).fill(null);columns.forEach((col,c)=>col.slice(-state.rows).reverse().forEach((id,k)=>candidate[idx(state.rows-1-k,c)]=id));
    const old=state.board;state.board=candidate;refreshCache();const h=findHint();state.board=old;refreshCache();if(h)return candidate;
  }
  return null;
}
async function useHint(){
  if(state.busy)return;
  let h=findHint();
  if(!h){const rescued=rescueShuffle();if(rescued){state.busy=true;const old=state.board.slice();await animateBoard(old,rescued,320);state.busy=false;h=findHint();toast('已整理出可拼路径',1200);}else{toast('当前布局需要先移动一块腾出空间',1500);return;}}
  state.hintIds=new Set(h.group.ids);state.hintUntil=performance.now()+3000;const p=center(h.targetCells[0]);toast(h.completeGain>0?'发光组合放到虚线位置即可完成小图':'发光组合靠近虚线位置会磁吸',1900);state.particles.push({x:p.x,y:p.y,vx:0,vy:-18,start:performance.now(),life:700,color:'#ffe272'});sound('snap');markDirty();
}

function clearLongPress(){if(state.longPressTimer){clearTimeout(state.longPressTimer);state.longPressTimer=0;}}
function pointerDown(e){
  if(state.busy)return;state.canvasClientRect=els.canvas.getBoundingClientRect();
  const p=pointerPos(e),cell=cellAt(p.x,p.y),id=state.board[cell];if(!id)return;
  const group=groupFor(id),c=center(cell);
  state.drag={pointerId:e.pointerId,anchorId:id,group,sourceBoard:state.board.slice(),startX:p.x,startY:p.y,dx:0,dy:0,visualDx:0,visualDy:0,offsetX:p.x-c.x,offsetY:p.y-c.y,plan:null,lastRaw:-2,splitMode:false,moved:false,downAt:performance.now()};
  try{els.canvas.setPointerCapture(e.pointerId);}catch(_){}sound('tap');
  clearLongPress();
  if(group.size>1){state.longPressTimer=setTimeout(()=>{const d=state.drag;if(!d||d.moved)return;d.group={ids:[id],cells:[cell],size:1};d.splitMode=true;d.anchorId=id;d.plan=null;d.lastRaw=-2;sound('split');buzz(12);toast('已拆出单块，继续拖动',900);},310);}
}
function pointerMove(e){
  const d=state.drag;if(!d||d.pointerId!==e.pointerId)return;e.preventDefault();
  const p=pointerPos(e);d.dx=p.x-d.startX;d.dy=p.y-d.startY;if(Math.hypot(d.dx,d.dy)>8){d.moved=true;clearLongPress();}
  const anchorCell=state.cache.positions.get(d.anchorId);if(anchorCell===undefined)return;
  const ac=center(anchorCell),raw=cellAt(ac.x+d.dx,ac.y+d.dy);
  if(raw!==d.lastRaw){d.lastRaw=raw;d.plan=choosePlan(d.group,d.anchorId,raw,false);}
  d.visualDx=d.dx;d.visualDy=d.dy;
  if(d.plan&&(d.plan.added>0||d.plan.completeGain>0||d.plan.largestGain>0)){
    const targetAnchor=d.plan.targetCells[d.group.ids.indexOf(d.anchorId)],tc=center(targetAnchor),tx=tc.x-ac.x,ty=tc.y-ac.y;
    const dist=Math.hypot(d.dx-tx,d.dy-ty),threshold=Math.max(state.cellW,state.cellH)*.72;
    if(dist<threshold){const k=.38*(1-dist/threshold);d.visualDx=lerp(d.dx,tx,k);d.visualDy=lerp(d.dy,ty,k);}
  }
  markDirty();
}
function pointerEnd(e){
  const d=state.drag;if(!d||d.pointerId!==e.pointerId)return;
  clearLongPress();state.drag=null;try{els.canvas.releasePointerCapture(e.pointerId);}catch(_){}
  if(Math.hypot(d.dx,d.dy)<7){toast(d.group.size>1?'直接拖动可移动整组；长按后拖可拆单块':'拖到其他格子即可交换',900);return;}
  if(!d.plan){const anchorCell=state.cache.positions.get(d.anchorId),ac=center(anchorCell),target=cellAt(ac.x+d.dx,ac.y+d.dy);d.plan=choosePlan(d.group,d.anchorId,target,true);}
  if(!d.plan){toast('这个组合放不下，换个方向或长按拆一块',1200);return;}
  const starts=new Map(),pos=boardPositions(d.sourceBoard);d.group.ids.forEach(id=>{const cell=pos.get(id),r=cellRect(cell);starts.set(id,{x:r.x+d.visualDx,y:r.y+d.visualDy,w:r.w,h:r.h});});
  void commitPlan(d.plan,starts);
}

async function solveCurrentWave(){
  if(state.stage!==1)return;
  state.busy=true;
  const old=state.board.slice(),next=Array(16).fill(null),macros=WAVE_SETS[state.wave],anchors=[0,2,8,10];
  for(let k=0;k<4;k++){const macro=macros[k],a=anchors[k];for(let q=0;q<4;q++)next[a+(q>1?4:0)+(q%2)]=`p-${macro}-${q}`;}
  state.decks=Array.from({length:4},()=>[]);await animateBoard(old,next,420);state.busy=false;await resolveBoard();
}
async function solveStage2(){
  if(state.stage!==2)await startStage2();state.busy=true;const next=Array(25).fill(null);for(let m=0;m<16;m++){const r=Math.floor(m/4)+1,c=m%4;next[idx(r,c)]=`m-${m}`;}
  const old=state.board.slice();state.decks=Array.from({length:5},()=>[]);await animateBoard(old,next,520);await wait(240);await finishGame();
}
async function quickAction(){
  if(state.stage===1){state.collected=new Set(Array.from({length:16},(_,i)=>i));drawMap();await transitionToStage2();}else await solveStage2();
}
function reset(){clearLongPress();els.finish.classList.remove('is-visible');void startStage1();}

els.canvas.addEventListener('pointerdown',pointerDown);
els.canvas.addEventListener('pointermove',pointerMove,{passive:false});
els.canvas.addEventListener('pointerup',pointerEnd);
els.canvas.addEventListener('pointercancel',pointerEnd);
els.hint.addEventListener('click',()=>void useHint());
els.restart.addEventListener('click',reset);
els.quick.addEventListener('click',()=>void quickAction());
els.again.addEventListener('click',reset);
els.photoBtn.addEventListener('click',()=>els.photoOverlay.classList.add('is-visible'));
els.photoClose.addEventListener('click',()=>els.photoOverlay.classList.remove('is-visible'));
els.photoOverlay.addEventListener('click',e=>{if(e.target===els.photoOverlay)els.photoOverlay.classList.remove('is-visible');});
window.addEventListener('resize',resize,{passive:true});

window.__REAL_COMBINE__={
  version:VERSION,
  state:()=>({stage:state.stage,wave:state.wave,collected:state.collected.size,board:state.board.slice(),deck:remainingDeck(),moves:state.moves.slice(),snaps:state.snaps,connections:state.connectionCount,largest:largestGroup(),planMs:state.lastPlanMs}),
  geometry:()=>({boardRect:{...state.boardRect},cellW:state.cellW,cellH:state.cellH,rows:state.rows,cols:state.cols}),
  findHint:()=>{const h=findHint();return h?{anchorId:h.anchorId,targetCell:h.targetCells[h.group.ids.indexOf(h.anchorId)],added:h.added,completeGain:h.completeGain,largestGain:h.largestGain}:null;},
  applyHint:async()=>{const h=findHint();return h?commitPlan(h,new Map()):false;},
  startStage2,solveStage2,solveCurrentWave,quickAction,reset
};

img.onload=async()=>{
  els.photoPreview.src=MASTER_URL;els.finalPhoto.src=MASTER_URL;resize();els.loading.classList.add('is-hidden');raf=requestAnimationFrame(frame);await startStage1();
  if(new URLSearchParams(location.search).get('autotest')==='1'){await wait(250);await startStage2();await wait(350);await solveStage2();document.body.dataset.autotest='complete';}
};
img.onerror=()=>{els.loading.querySelector('span').textContent='实景图片加载失败，请刷新重试';};
})();

</script>
