<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#08172d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>实景下落合成 v5 · 拼出花来</title>
  <link rel="stylesheet" href="real-combine-v5.css?v=5.0.0" />
</head>
<body>
  <main id="app" class="app-shell">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <header class="topbar">
      <a class="back-btn" href="./?v=4.2.0" aria-label="返回首页">‹</a>
      <div class="stage-copy"><small id="stageKicker">第一阶段 · 小图消除</small><strong id="stageTitle">4块拼成局部实景</strong></div>
      <button id="hintBtn" class="tool-btn">提示</button>
    </header>

    <section class="master-panel">
      <div class="master-head"><div><span id="goalLabel">先完成16张局部小图</span><b id="goalValue">0 / 16</b></div><button id="photoBtn" aria-label="查看完整目标">看原图</button></div>
      <div class="progress-track"><i id="progressFill"></i></div>
      <canvas id="masterMap" aria-label="完整实景进度"></canvas>
    </section>

    <section class="game-card">
      <div class="deck-row">
        <div class="deck-title"><small id="deckTitle">下一批碎片</small><b id="deckCount">52</b></div>
        <div id="deckPreview" class="deck-preview" aria-label="下一批预览"></div>
      </div>
      <div class="canvas-shell"><canvas id="gameCanvas" aria-label="下落式层级拼图"></canvas><div id="snapBadge" class="snap-badge">磁吸</div></div>
      <div class="status-row"><span id="message">拖动交换，正确边自动磁吸；长按已拼组合可拆单块。</span><b id="moveCount">0步</b></div>
    </section>

    <section class="actions"><button id="restartBtn">重新开始</button><button id="quickBtn" class="primary">直接体验大图阶段</button></section>

    <section id="transition" class="overlay" aria-live="polite">
      <div class="transition-card"><small>16张局部小图已完成</small><h2>现在重新出现</h2><p>刚才消除的16张局部，将继续通过发牌、下落与磁吸，组成一张完整实景。</p><canvas id="transitionCanvas"></canvas></div>
    </section>

    <section id="photoOverlay" class="overlay photo-overlay"><button id="photoClose" class="overlay-close">×</button><div class="photo-card"><img id="photoPreview" alt="完整目标实景" /><p>最终目标：晨曦湖畔花海村庄</p></div></section>

    <section id="finish" class="overlay finish-overlay"><div class="finish-card"><small>REAL SCENE COMPLETE</small><h2>完整实景合成完成</h2><div class="final-photo"><img id="finalPhoto" alt="完成的大图" /></div><p>64个细碎片 → 16张局部小图 → 1张完整实景</p><div class="stats"><span>小图阶段 <b id="microMoves">0</b> 步</span><span>大图阶段 <b id="bossMoves">0</b> 步</span></div><button id="againBtn">再体验一次</button></div></section>

    <div id="toast" class="toast"></div>
    <div id="loading" class="loading"><i></i><span>正在加载实景与顺滑拖拽引擎…</span></div>
  </main>

  <script src="assets/synthesis-real-v5/master-1.js?v=5.0.0"></script>
  <script src="assets/synthesis-real-v5/master-2.js?v=5.0.0"></script>
  <script src="assets/synthesis-real-v5/master-3.js?v=5.0.0"></script>
  <script src="assets/synthesis-real-v5/master-4.js?v=5.0.0"></script>
  <script src="real-combine-v5.js?v=5.0.0"></script>
</body>
</html>
