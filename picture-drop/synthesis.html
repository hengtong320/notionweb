<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#081426" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <title>层级合成 · Jigsaw Drop</title>
  <link rel="stylesheet" href="synthesis.css?v=2.0.0" />
</head>
<body>
  <main id="synthesisApp" class="synthesis-app">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <header class="topbar">
      <a class="back-btn" href="./?v=4.2.0" aria-label="返回首页">‹</a>
      <div class="title-copy">
        <span id="stageKicker">阶段 1 / 3 · 微颗粒拼合</span>
        <strong id="stageTitle">先完成16个局部区域</strong>
      </div>
      <button id="hintBtn" class="header-btn">提示</button>
    </header>

    <section class="target-panel">
      <div class="target-image-wrap">
        <img id="targetImage" src="assets/pictures-portrait/30-library.webp" alt="最终大图目标：书香晨光" />
        <canvas id="mapCanvas" aria-hidden="true"></canvas>
      </div>
      <div class="target-copy">
        <small>最终目标</small>
        <b>书香晨光</b>
        <p id="stageDescription">把像素般的小颗粒先拼成局部；每完成一个局部，它会吸附、合成并消失进入收藏。</p>
      </div>
    </section>

    <section class="stepper" aria-label="合成阶段">
      <div id="step1" class="step is-active"><i>1</i><span>微颗粒</span></div>
      <em></em>
      <div id="step2" class="step"><i>2</i><span>区域块</span></div>
      <em></em>
      <div id="step3" class="step"><i>3</i><span>完整大图</span></div>
    </section>

    <section class="progress-card">
      <div class="progress-top">
        <span id="progressLabel">第1波 · 4个局部</span>
        <b id="progressValue">0 / 16</b>
      </div>
      <div class="progress-track"><i id="progressFill"></i></div>
      <div id="collectionStrip" class="collection-strip" aria-label="已合成区域"></div>
    </section>

    <section class="canvas-card">
      <canvas id="gameCanvas" aria-label="层级合成游戏画布"></canvas>
      <div id="loadingMask" class="loading-mask"><span></span><b>正在加载大图细节…</b></div>
      <div id="messageToast" class="message-toast" aria-live="polite"></div>
    </section>

    <section class="status-row">
      <div><small>本阶段</small><b id="stageMoves">0步</b></div>
      <div><small>吸附次数</small><b id="snapCount">0</b></div>
      <div><small>总完成度</small><b id="totalPercent">0%</b></div>
    </section>

    <section class="bottom-actions">
      <button id="restartBtn">重新开始</button>
      <button id="quickBtn" class="accent">快速看下一阶段</button>
    </section>

    <section id="transitionOverlay" class="overlay transition-overlay" aria-live="polite">
      <div class="overlay-card">
        <small id="transitionKicker">16个局部已完成</small>
        <h2 id="transitionTitle">区域合成开启</h2>
        <p id="transitionText">刚才消失的局部重新出现，再拼成4个更大的区域块。</p>
        <div id="transitionPreview" class="transition-preview"></div>
      </div>
    </section>

    <section id="finishOverlay" class="overlay finish-overlay">
      <div class="finish-card">
        <small>HIERARCHICAL SYNTHESIS</small>
        <h2>层级合成完成</h2>
        <div class="finish-image"><img src="assets/pictures-portrait/30-library.webp" alt="完整大图：书香晨光" /></div>
        <p>64个微颗粒 → 16个局部 → 4个区域块 → 1张完整大图</p>
        <div class="finish-stats">
          <span>微颗粒 <b id="finishStage1">0</b>步</span>
          <span>区域块 <b id="finishStage2">0</b>步</span>
          <span>最终大图 <b id="finishStage3">0</b>步</span>
        </div>
        <button id="againBtn">再体验一次</button>
      </div>
    </section>
  </main>
  <script src="synthesis.js?v=2.0.0"></script>
</body>
</html>
