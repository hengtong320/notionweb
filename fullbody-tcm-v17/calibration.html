<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定位校准工作台</title><style>body{font:16px/1.8 system-ui;margin:32px auto;padding:0 20px;max-width:960px;color:#294b3c;background:#f4f6ee}article{padding:18px;background:white;border:1px solid #cddac8;border-radius:12px;margin:14px 0}a{color:#24684e}small{display:block}code{overflow-wrap:anywhere}</style><a href="./">返回三维</a> · <a href="./evidence.html">查阅资料</a><h1>定位校准工作台</h1><p>本轮建立6个代表条目的可追溯核对流程，没有伪造皮肤配准、专业审核或误差。0个坐标已通过完整定位审核。</p><div id="cases"></div><p><a href="calibration-pilot.json" download>导出核对清单 JSON</a> · <a href="coordinate-audit.csv" download>原361穴审核清单</a></p><script>fetch('calibration-pilot.json').then(r=>r.json()).then(d=>{for(const p of d.cases){const a=document.createElement('article'),h=document.createElement('h2'),desc=document.createElement('p'),small=document.createElement('small'),link=document.createElement('a');h.textContent=p.name+' '+p.code;desc.textContent=p.locationSummary;small.textContent='待确认标志：'+p.requiredLandmarks+'。皮肤配准、独立复核、实测误差：均未完成。';link.textContent='在三维中查看相关部位';link.href='./#kind=point&id='+encodeURIComponent(p.code)+'&mode=strict';a.append(h,desc,small,link);document.getElementById('cases').append(a);}});</script></html>
