name: Finalize V30 surface captions
on:
  push:
    paths: ['.github/workflows/atlas30-caption.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env: {NODE_PATH: /tmp/a30/node_modules, BROWSER: '${{ matrix.browser }}', ATLAS_VERSION: '30'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare bounded caption correction and exact browser
        run: |
          python atlas30-caption/finish.py prepare
          npm install --prefix /tmp/a30 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a30/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v30/app.js'],outfile:'fullbody-tcm-v30/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python atlas30-caption/finish.py record
      - name: Actual phone surface captions and pure-skin/bone transitions
        run: node atlas30-caption/verify.cjs
      - name: Prior 19 contact pixels, side filters and sex-switch checks
        if: '!cancelled()'
        run: node atlas30-publish/verified-tests/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-${{ matrix.browser }}
          path: |
            fullbody-tcm-v30/
            atlas30-caption-evidence/
            atlas30-evidence/
          retention-days: 14
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with: {name: caption-chromium, path: /tmp/caption-chromium}
      - uses: actions/download-artifact@v4
        with: {name: caption-webkit, path: /tmp/caption-webkit}
      - name: Promote only hash-matching corrected caption code
        run: |
          python atlas30-caption/finish.py publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v30 atlas30-caption/evidence
          git commit -m 'Fix V30.0.1 surface heading after restoring the male point selection'
          git push origin HEAD:main
  public:
    needs: publish
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NODE_PATH: /tmp/a30/node_modules
      BROWSER: ${{ matrix.browser }}
      ATLAS_VERSION: '30'
      TEST_URL: https://hengtong320.github.io/notionweb/anatomy/?v=30.0.1
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the same browser for public verification
        run: |
          npm install --prefix /tmp/a30 playwright@1.56.1 pngjs@7.0.0
          /tmp/a30/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for final entry activation and exact public runtime
        run: |
          python - <<'PY'
          import os,json,time,hashlib,urllib.request
          from pathlib import Path
          b=json.loads(Path('fullbody-tcm-v30/build-info.json').read_text());assert b['version']=='30.0.1'
          root='https://hengtong320.github.io/notionweb/'
          for i in range(48):
              try:
                  def get(path):return urllib.request.urlopen(urllib.request.Request(root+path+'?check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'}),timeout=30).read()
                  entry=get('anatomy/').decode();assert '30.0.1' in entry and '../fullbody-tcm-v30/' in entry
                  hashes={n:hashlib.sha256(get('fullbody-tcm-v30/'+n)).hexdigest() for n in ['index.html','app.bundle.js']}
                  assert all(hashes[n]==b['files'][n] for n in hashes)
                  Path('atlas30-caption-evidence').mkdir(exist_ok=True)
                  Path('atlas30-caption-evidence/content-'+os.environ['BROWSER']+'.json').write_text(json.dumps({'success':True,'version':'30.0.1','hashes':hashes,'checkedAt':time.time()},indent=2));break
              except Exception as e:
                  print('Waiting for final patch deployment:',e,flush=True)
                  if i==47:raise
                  time.sleep(10)
          PY
      - name: Public captions, opacity and skin/bone switching
        run: node atlas30-caption/verify.cjs
      - name: Public contact, pigment pixels and hidden-state checks
        if: '!cancelled()'
        run: node atlas30-publish/verified-tests/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-public-${{ matrix.browser }}
          path: |
            atlas30-caption-evidence/
            atlas30-evidence/live-*
          retention-days: 14
