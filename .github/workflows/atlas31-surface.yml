name: V31 surface consistency
on:
  push:
    paths: ['atlas31-repair/**', '.github/workflows/atlas31-surface.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas31-surface
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    env:
      NODE_PATH: /tmp/a31/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install tested graphics and browser engines
        run: |
          npm install --prefix /tmp/a31 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a31/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture unchanged V30 baseline
        env: {ATLAS_VERSION: '30', OUT_DIR: atlas31-baseline}
        run: node atlas31-repair/verify.cjs
      - name: Build bounded V31 repair when present
        run: |
          if test -f atlas31-repair/patch.py; then
            python atlas31-repair/patch.py
            node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v31/app.js'],outfile:'fullbody-tcm-v31/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          fi
      - name: Verify new runtime
        run: |
          if test -d fullbody-tcm-v31; then ATLAS_VERSION=31 OUT_DIR=atlas31-evidence node atlas31-repair/verify.cjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas31-${{ matrix.browser }}
          path: |
            atlas31-baseline/
            atlas31-evidence/
            atlas31-repair/
            fullbody-tcm-v31/
          retention-days: 14
