name: Inspect meridian skin curves
on:
  push:
    paths: ['.github/workflows/atlas24-inspect.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {NODE_PATH: /tmp/a24/node_modules}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --prefix /tmp/a24 playwright@1.56.1
          /tmp/a24/node_modules/.bin/playwright install --with-deps webkit
          sudo apt-get install -y fonts-noto-cjk
      - run: node atlas24-repair/inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas24-current-meridian-inspection
          path: atlas24-inspection-v23/
          retention-days: 14
