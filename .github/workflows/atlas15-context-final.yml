name: Finalize V15 visible context review
on:
  push:
    paths:
      - '.github/workflows/atlas15-context-final.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: atlas15-context-final
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/atlas15-final/node_modules
    steps:
      - name: Require the original V15 public release to finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,json,time,os
          for i in range(110):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/36270682152']))
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  break
              time.sleep(5)
          else:raise RuntimeError('Prior publication did not complete')
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: atlas15-candidate
          run-id: 36270630390
          github-token: ${{ github.token }}
          path: /tmp/atlas15-reviewed
      - name: Install pinned tools for both real browser engines
        run: |
          npm install --prefix /tmp/atlas15-final three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          /tmp/atlas15-final/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Patch only the observed view-context issue
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('fullbody-tcm-v15')
          assert hashlib.sha256((p/'app.bundle.js').read_bytes()).hexdigest()=='62febe28b3c30aed759a3c434cf950540f6bd2c598e47609f77106023c2d001b'
          assert json.loads((p/'delivery-release.json').read_text())['published']
          Path('/tmp/atlas15-entry.html').write_bytes(Path('anatomy/index.html').read_bytes())
          PY
          git rev-parse HEAD:fullbody-tcm-v15 > /tmp/atlas15-base-tree.txt
          python atlas15-finalize/context.py
          node --check fullbody-tcm-v15/female-v12.js
          node /tmp/atlas15-reviewed/atlas15-delivery/build.cjs
          test -z "$(git diff HEAD -- fullbody-tcm-v9/ fullbody-tcm-v11/ fullbody-tcm-v12/ fullbody-tcm-v13/ fullbody-tcm-v14/ anatomy/)"
      - name: Chromium final rendering and switching journey
        run: node /tmp/atlas15-reviewed/atlas15-delivery/verify.cjs
      - name: WebKit final rendering and switching journey
        env:
          BROWSER: webkit
        run: node /tmp/atlas15-reviewed/atlas15-delivery/verify.cjs
      - name: Publish the exact tested patch without touching old viewers
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for n in ['local-chromium','local-webkit']:
              r=json.loads(Path(f'fullbody-tcm-v15/checks/{n}.json').read_text());assert r['success'] and all(x['pass'] for x in r['checks'])
          PY
          git fetch origin main
          git worktree add -B atlas15-final-context /tmp/atlas15-final-publish origin/main
          test "$(git -C /tmp/atlas15-final-publish rev-parse HEAD:fullbody-tcm-v15)" = "$(cat /tmp/atlas15-base-tree.txt)"
          cp -a fullbody-tcm-v15/. /tmp/atlas15-final-publish/fullbody-tcm-v15/
          cd /tmp/atlas15-final-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v15/
          git commit -m 'Apply visually reviewed V15.0.1 offscreen-context guidance without automatic refocusing'
          git push origin HEAD:main
      - name: Request updated Pages files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent || echo 'Waiting for normal Pages build'
      - name: Require exact updated public application and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request,time,os
          p=Path('fullbody-tcm-v15');info=json.loads((p/'build-info.json').read_text());result=[]
          for name,meta in info['files'].items():
              for i in range(75):
                  try:
                      with urllib.request.urlopen('https://hengtong320.github.io/notionweb/fullbody-tcm-v15/'+name+'?revision='+os.environ['GITHUB_RUN_ID']+'&n='+str(i),timeout=30) as r:b=r.read()
                      if hashlib.sha256(b).hexdigest()==meta['sha256']:break
                  except Exception as e:print(name,str(e),flush=True)
                  time.sleep(5)
              else:raise RuntimeError('Public mismatch '+name)
              result.append({'file':name,'sha256':meta['sha256'],'pass':True});print('PUBLIC_MATCH',name,flush=True)
          (p/'checks/public-files.json').write_text(json.dumps({'success':True,'files':result},indent=2))
          PY
      - name: Repeat all final checks on the actual public webpage
        env:
          TEST_URL: https://hengtong320.github.io/notionweb/fullbody-tcm-v15/?release=${{ github.run_id }}
        run: node /tmp/atlas15-reviewed/atlas15-delivery/verify.cjs
      - name: Confirm fixed entry opens the corrected version
        run: |
          node - <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});try{const p=await b.newPage({viewport:{width:1440,height:1000}});await p.goto('https://hengtong320.github.io/notionweb/anatomy/?release='+process.env.GITHUB_RUN_ID,{timeout:90000});await p.waitForFunction(()=>window.__ATLAS_SHARED__?.getState().version==='15.0.1'&&__FOOT_ATLAS__.getState().ready,undefined,{timeout:90000});if(!p.url().includes('/fullbody-tcm-v15/'))throw Error('Wrong fixed entry');fs.writeFileSync('fullbody-tcm-v15/checks/stable-entry.json',JSON.stringify({success:true,url:p.url(),version:'15.0.1',checkedAt:new Date().toISOString()},null,2));}finally{await b.close();}})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish final truthful delivery evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,shutil
          p=Path('fullbody-tcm-v15');info=json.loads((p/'build-info.json').read_text());reports={k:json.loads((p/'checks'/f'{k}.json').read_text()) for k in ['local-chromium','local-webkit','live-chromium']}
          for k,r in reports.items():assert r['success'] and all(c['pass'] for c in r['checks']),k
          audit=json.loads((p/'checks/live-chromium-projection-audit.json').read_text())
          old=json.loads((p/'delivery-release.json').read_text())
          release={**old,**info,'status':'published-and-browser-verified','published':True,'url':reports['live-chromium']['url'],'workflowRun':os.environ['GITHUB_RUN_ID'],'previousPublishRun':36270682152,'checks':{k:len(r['checks']) for k,r in reports.items()},'checkedAt':reports['live-chromium']['finishedAt'],'viewContextReview':True,'explicitRefocusOnly':True,'projectionDiagnostic':{'purpose':'Display consistency, not anatomical or clinical accuracy','pointInstances':audit['count'],'sameSideExactCoordinateCollisions':len(audit['collisions']),'secondaryRelocation':audit['maxSecondaryShift'],'sampledRouteGap':audit['maxLineGap'],'geometryFinite':audit['geometryFinite'],'maxDisplayDisplacementModelUnits':max(x['displayDisplacement'] for x in audit['points'])}}
          (p/'delivery-release.json').write_text(json.dumps(release,ensure_ascii=False,indent=2))
          dest=Path('/tmp/atlas15-final-publish/fullbody-tcm-v15');shutil.copy2(p/'delivery-release.json',dest/'delivery-release.json');shutil.copytree(p/'checks',dest/'checks',dirs_exist_ok=True)
          assert Path('/tmp/atlas15-final-publish/anatomy/index.html').read_bytes()==Path('/tmp/atlas15-entry.html').read_bytes()
          PY
          cd /tmp/atlas15-final-publish
          git add fullbody-tcm-v15/delivery-release.json fullbody-tcm-v15/checks/
          git commit -m 'Record final public V15.0.1 visual, mobile, switching and fixed-entry verification'
          git push origin HEAD:main
      - name: Export the final version and inspected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas15-context-final
          path: fullbody-tcm-v15/
          retention-days: 14
