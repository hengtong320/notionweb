name: Publish V57 squat box contact and bounded surface display
on:
  push:
    paths:
      - 'atlas57-tools/**'
      - '.github/workflows/atlas57-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas57-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas57-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas57-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas57-build/node_modules node atlas57-tools/build.cjs
          node --check fullbody-tcm-v57/app.bundle.js
          node --check fullbody-tcm-v57/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: b59b756876b01e9503e580e4539ec77f816fe3c47a46b49e13f31bdefd7957da
          EXPECTED_POSE: 52213c1aef774652c865bd7d1b8c3eb8a51c95390cf10149e8d64661d917d503
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v57')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          expected=json.loads(pathlib.Path('atlas57-tools/reviewed-files.json').read_text())
          actual=json.loads((d/'build-info.json').read_text())['files']
          differences={name:{'local':expected.get(name),'build':sha} for name,sha in actual.items() if sha!=expected.get(name)}
          print('Reviewed file differences:',json.dumps(differences))
          assert actual==expected
          for name,sha in expected.items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v56' in s or 'fullbody-tcm-v57' in s
          p.write_text(s.replace('fullbody-tcm-v56','fullbody-tcm-v57').replace('56.0.0','57.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v56 fullbody-tcm-v55 fullbody-tcm-v54 fullbody-tcm-v53 fullbody-tcm-v52 fullbody-tcm-v51 fullbody-tcm-v50 fullbody-tcm-v49 fullbody-tcm-v48 fullbody-tcm-v47 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v57 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V57 squat box contact and bounded surface display"
          git push origin HEAD:main
