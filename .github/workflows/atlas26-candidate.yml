name: Verify V26 meridian reading
on:
  push:
    paths: ['atlas26-repair/**', '.github/workflows/atlas26-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas26-candidate
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_PATH: /tmp/a26/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconcile the interrupted repair without changing V25
        run: |
          python atlas26-repair/patch.py
          python atlas26-repair/followup.py
      - name: Install pinned rendering and browser dependencies
        run: |
          npm install --prefix /tmp/a26 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a26/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Build and hash exact runtime
        run: |
          node --check atlas26-repair/verify.cjs
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v26/app.js'],outfile:'fullbody-tcm-v26/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path('fullbody-tcm-v26')
          data={'version':'26.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()},'clinicalCalibration':False}
          (p/'build-info.json').write_text(json.dumps(data,indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v25/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Actual V25 comparison and V26 pixel and interaction checks
        run: node atlas26-repair/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas26-${{ matrix.browser }}
          path: |
            fullbody-tcm-v26/
            atlas26-repair/
          retention-days: 14
