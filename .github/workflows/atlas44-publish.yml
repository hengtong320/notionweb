name: Publish V44 labels clear of posed bones
on:
  push:
    paths:
      - 'atlas44-tools/**'
      - '.github/workflows/atlas44-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas44-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas44-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas44-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas44-build/node_modules node atlas44-tools/build.cjs
          node --check fullbody-tcm-v44/app.bundle.js
          node --check fullbody-tcm-v44/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: a4003058a23ad360e8e6f37a9d182132062486535a370404956a3caf3e5c1809
          EXPECTED_POSE: 14187fda7aed46f8f0bd5d5fdc6a1f09d9359987394b771b6f480e292c33e455
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v44')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          for name,sha in json.loads((d/'build-info.json').read_text())['files'].items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v43' in s or 'fullbody-tcm-v44' in s
          p.write_text(s.replace('fullbody-tcm-v43','fullbody-tcm-v44').replace('43.0.0','44.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v43 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v44 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V44 body labels clear of posed bones"
          git push origin HEAD:main
