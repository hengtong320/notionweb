name: Publish V56 observation layout and ground occlusion fixes
on:
  push:
    paths:
      - 'atlas56-tools/**'
      - '.github/workflows/atlas56-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas56-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas56-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas56-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas56-build/node_modules node atlas56-tools/build.cjs
          node --check fullbody-tcm-v56/app.bundle.js
          node --check fullbody-tcm-v56/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: fe7d3da8f368860a5d82f37d7f39eafd80c96fd0c9468a8fa5953db2770c2721
          EXPECTED_POSE: b01b8d7c02b0e12cdc6d353502eba9d30d3cdf315851ee2a95f04a58de34eca2
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v56')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          expected=json.loads(pathlib.Path('atlas56-tools/reviewed-files.json').read_text())
          actual=json.loads((d/'build-info.json').read_text())['files']
          differences={name:{'local':expected.get(name),'build':sha} for name,sha in actual.items() if sha!=expected.get(name)}
          print('Reviewed file differences:',json.dumps(differences))
          assert actual==expected
          for name,sha in expected.items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v55' in s or 'fullbody-tcm-v56' in s
          p.write_text(s.replace('fullbody-tcm-v55','fullbody-tcm-v56').replace('55.0.0','56.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v55 fullbody-tcm-v54 fullbody-tcm-v53 fullbody-tcm-v52 fullbody-tcm-v51 fullbody-tcm-v50 fullbody-tcm-v49 fullbody-tcm-v48 fullbody-tcm-v47 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v56 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V56 observation layout and ground occlusion fixes"
          git push origin HEAD:main
