name: Verify unified V14 learning controls
on:
  push:
    paths:
      - '.github/workflows/atlas14-unified-candidate.yml'
      - 'atlas14-delivery/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas14-unified-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_PATH: /tmp/atlas14/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned actual browser and build tools
        run: |
          npm install --prefix /tmp/atlas14 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          /tmp/atlas14/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build V14 from preserved V13
        run: |
          cat atlas14-delivery/shared-v14.js.part0 atlas14-delivery/shared-v14.js.part1 > atlas14-delivery/shared-v14.js
          python atlas14-delivery/patch.py
          if test -f atlas14-delivery/fixes.py; then python atlas14-delivery/fixes.py; fi
          if test -f atlas14-delivery/final.py; then python atlas14-delivery/final.py; fi
          if test -f atlas14-delivery/review.py; then python atlas14-delivery/review.py; fi
          node --check fullbody-tcm-v14/shared-v14.js
          node --check fullbody-tcm-v14/female-v12.js
          node --check fullbody-tcm-v14/learning-enhancements.js
          node atlas14-delivery/build.cjs
          test -z "$(git diff HEAD -- fullbody-tcm-v9/ fullbody-tcm-v11/ fullbody-tcm-v12/ fullbody-tcm-v13/ anatomy/)"
      - name: Chromium full shared-interface learning journey
        run: node atlas14-delivery/verify.cjs
      - name: WebKit full shared-interface learning journey
        env:
          BROWSER: webkit
        run: node atlas14-delivery/verify.cjs
      - name: Export candidate and actual render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas14-unified-candidate
          path: |
            fullbody-tcm-v14/
            atlas14-delivery/
          retention-days: 14
