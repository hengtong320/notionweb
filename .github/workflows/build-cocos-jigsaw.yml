name: Build Jigsaw Drop Cocos Creator Project

on:
  push:
    paths:
      - 'picture-drop/tools/generate_cocos_project.py'
      - 'picture-drop/tools/patch_cocos_project.py'
      - '.github/workflows/build-cocos-jigsaw.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocos-jigsaw-drop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install generator dependency
        run: python -m pip install --quiet pillow

      - name: Fetch a clean Cocos Creator 3.8.6 project template
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/Atmosaero/Match3-Sample-CocosCreator.git /tmp/cocos-template
          test "$(node -p "require('/tmp/cocos-template/package.json').creator.version")" = '3.8.6'

      - name: Generate Jigsaw Drop Cocos project
        run: |
          set -euo pipefail
          python picture-drop/tools/generate_cocos_project.py \
            --template /tmp/cocos-template \
            --source picture-drop \
            --out cocos-jigsaw-drop
          python picture-drop/tools/patch_cocos_project.py
          test -f cocos-jigsaw-drop/assets/scenes/Main.scene
          test -f cocos-jigsaw-drop/assets/scripts/GameBootstrap.ts
          test -f cocos-jigsaw-drop/assets/scripts/core/JigsawCore.ts
          test -f cocos-jigsaw-drop/assets/scripts/platform/PlatformBridge.ts
          test "$(find cocos-jigsaw-drop/assets/resources/pictures -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')" = '18'

      - name: Validate scene references and project manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('cocos-jigsaw-drop')
          scene=json.loads((root/'assets/scenes/Main.scene').read_text(encoding='utf-8'))
          assert scene and scene[0]['__type__']=='cc.SceneAsset'
          refs=[]
          def walk(v):
              if isinstance(v,dict):
                  if set(v)=={'__id__'} and isinstance(v['__id__'],int): refs.append(v['__id__'])
                  else:
                      for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(scene)
          assert all(0 <= i < len(scene) for i in refs), (len(scene), max(refs, default=-1))
          assert any(x.get('__type__')=='54d8ahqchdBm7RV08C23Y8J' for x in scene)
          pkg=json.loads((root/'package.json').read_text(encoding='utf-8'))
          assert pkg['creator']['version']=='3.8.6'
          manifest=json.loads((root/'migration-manifest.json').read_text(encoding='utf-8'))
          assert len(manifest['images'])==18
          print('PASS Cocos scene references and project manifest')
          PY

      - name: Type-check Cocos scripts and run pure core tests
        working-directory: cocos-jigsaw-drop
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund \
            typescript@5.3.3 \
            tsx@4.19.4 \
            @cocos/creator-types@3.8.6
          npx tsc -p tsconfig.ci.json --noEmit
          npx tsx tests/core.test.ts
          rm -rf node_modules package-lock.json

      - name: Build downloadable project archive
        run: |
          set -euo pipefail
          rm -f cocos-jigsaw-drop/Jigsaw-Drop-Cocos-3.8.6.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          root=Path('cocos-jigsaw-drop')
          (root/'release.json').write_text(json.dumps({
            'version':'0.1.0',
            'creator':'3.8.6',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'openable Cocos Creator 3.8.6 TypeScript project',
              'native Cocos 2D Sprite, Graphics, Label, touch and tween rendering',
              'pure TypeScript JigsawCore separated from presentation',
              '4x4 photorealistic blessing sample and 5x5 six-helicopter challenge',
              'single texture per complete picture with quadrant SpriteFrame cropping',
              'single/group dragging, long-press split, region swap and gravity settlement',
              'complete-image clear loop, deck dealing, hints and result collage',
              'Web, WeChat wx and Douyin tt platform bridge skeletons',
              '18 optimized 900x1200 photorealistic WebP assets'
            ]
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          zip -qr /tmp/Jigsaw-Drop-Cocos-3.8.6.zip cocos-jigsaw-drop \
            -x 'cocos-jigsaw-drop/node_modules/*' \
               'cocos-jigsaw-drop/library/*' \
               'cocos-jigsaw-drop/temp/*' \
               'cocos-jigsaw-drop/local/*' \
               'cocos-jigsaw-drop/build/*' \
               'cocos-jigsaw-drop/Jigsaw-Drop-Cocos-3.8.6.zip'
          mv /tmp/Jigsaw-Drop-Cocos-3.8.6.zip cocos-jigsaw-drop/
          test -s cocos-jigsaw-drop/Jigsaw-Drop-Cocos-3.8.6.zip
          echo "archive bytes: $(stat -c%s cocos-jigsaw-drop/Jigsaw-Drop-Cocos-3.8.6.zip)"

      - name: Commit generated Cocos project
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A cocos-jigsaw-drop
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m 'Add downloadable Jigsaw Drop Cocos Creator 3.8.6 prototype'
          git push origin HEAD:main
