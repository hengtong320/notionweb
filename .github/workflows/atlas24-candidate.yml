name: Verify V24 meridian rendering
on:
  push:
    paths: ['atlas24-repair/**', '.github/workflows/atlas24-candidate.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: atlas24-candidate
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix: {browser: [webkit, chromium]}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/a24/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: atlas24-current-meridian-inspection
          run-id: 36508270055
          github-token: ${{ github.token }}
          path: /tmp/atlas24-baseline
      - name: Build isolated V24 source
        run: |
          python atlas24-repair/patch.py
          python atlas24-repair/finalize.py
          python - <<'PY'
          from pathlib import Path
          for name in ['verify.cjs','prior-interactions.cjs','compatibility.cjs']:
              s=(Path('atlas23-publish/verified-tests')/name).read_text()
              s=s.replace("version=baseline?'22':'23'", "version=baseline?'22':'24'").replace('fullbody-tcm-v23','fullbody-tcm-v24').replace('23.0.0','24.0.0').replace("version:'23.0.0'","version:'24.0.0'")
              s=s.replace("(baseline?'baseline-v22-':live?'live-':'local-')+engine", "(baseline?'baseline-v22-':live?'selection-live-':'selection-local-')+engine")
              (Path('atlas24-repair')/('prior-'+name)).write_text(s)
          PY
      - name: Install pinned renderer and actual browser
        run: |
          npm install --prefix /tmp/a24 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a24/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Compile exact runtime and record hashes
        run: |
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v24/app.js'],outfile:'fullbody-tcm-v24/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path('fullbody-tcm-v24')
          original=Path('fullbody-tcm-v23')
          for f in original.glob('*.json'):
              if f.name not in ['build-info.json','release.json']:assert f.read_bytes()==(p/f.name).read_bytes(),f.name
          (p/'build-info.json').write_text(json.dumps({'version':'24.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()},'clinicalCalibration':False,'pointRegistrationUnchanged':True},indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v23/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Stroke, anchor and local-projection checks
        run: node atlas24-repair/verify.cjs
      - name: Whole-body and close-up visual evidence
        if: "!cancelled() && matrix.browser == 'webkit'"
        env: {VERSION: '24'}
        run: node atlas24-repair/inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas24-inspection-${{ matrix.browser }}
          path: |
            atlas24-inspection-v24/
            fullbody-tcm-v24/checks/local-*
          retention-days: 14
      - name: Prior structure-selection regressions
        if: '!cancelled()'
        run: node atlas24-repair/prior-verify.cjs
      - name: Prior saved-combination and switching regressions
        if: '!cancelled()'
        run: node atlas24-repair/prior-prior-interactions.cjs
      - name: Prior model coverage, layers and opaque skin
        if: '!cancelled()'
        run: node atlas24-repair/prior-compatibility.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas24-${{ matrix.browser }}
          path: |
            fullbody-tcm-v24/
            atlas24-repair/
            atlas24-inspection-v24/
          retention-days: 14
