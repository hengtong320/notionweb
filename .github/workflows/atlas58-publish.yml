name: Publish V58 head routes and opaque surface consistency
on:
  push:
    paths:
      - 'atlas58-tools/**'
      - '.github/workflows/atlas58-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas58-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct reviewed sources and build
        run: |
          python3 atlas58-tools/prepare.py
          npm install --prefix /tmp/atlas58-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas58-build/node_modules node atlas58-tools/build.cjs
          node --check fullbody-tcm-v58/app.bundle.js
          node --check fullbody-tcm-v58/pose.bundle.js
      - name: Check all mapped atlas routes and retained contacts
        run: |
          NODE_PATH=/tmp/atlas58-build/node_modules node -e 'require("esbuild").buildSync({entryPoints:["atlas58-tools/check-routes.mjs"],outfile:"/tmp/atlas58-routes.mjs",bundle:true,platform:"node",format:"esm",nodePaths:[process.env.NODE_PATH]})'
          node /tmp/atlas58-routes.mjs
      - name: Match reviewed files and preserve older versions
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json
          d=pathlib.Path('fullbody-tcm-v58')
          expected=json.loads(pathlib.Path('atlas58-tools/reviewed-all-files.json').read_text())
          actual={str(p.relative_to(d)):hashlib.sha256(p.read_bytes()).hexdigest() for p in d.rglob('*') if p.is_file()}
          assert actual==expected,{n for n in actual if actual[n]!=expected.get(n)}
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v57' in s or 'fullbody-tcm-v58' in s
          p.write_text(s.replace('fullbody-tcm-v57','fullbody-tcm-v58').replace('57.0.0','58.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v57 fullbody-tcm-v56 fullbody-tcm-v54 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish reviewed version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v58 anatomy/index.html atlas58-tools/route-verification.json
          git diff --cached --quiet || git commit -m "Publish V58 head routes and opaque surface consistency"
          git push origin HEAD:main
