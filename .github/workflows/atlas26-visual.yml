name: V26 phone visual inspection
on:
  push:
    paths: ['.github/workflows/atlas26-visual.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {NODE_PATH: /tmp/a26/node_modules, BROWSER: chromium}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install tested browser
        run: |
          npm install --prefix /tmp/a26 playwright@1.56.1 pngjs@7.0.0
          /tmp/a26/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Isolate phone painting layers while preserving the source
        run: |
          python atlas26-publish/diagnose-phone.py
          node atlas26-publish/visual-inspection.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas26-phone-paint
          path: |
            fullbody-tcm-v26/checks/paint-*
            atlas26-publish/visual-inspection.cjs
          retention-days: 14
