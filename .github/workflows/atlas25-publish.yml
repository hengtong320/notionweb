name: Publish verified V25 skin curves
on:
  push:
    paths: ['.github/workflows/atlas25-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas25-publish
  cancel-in-progress: false
env:
  CANDIDATE_RUN: '36568616867'
  CANDIDATE_SHA: 'dddebdad6a80290baa14ba0789d80f3ac1d74609'
jobs:
  publish:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Require every suite on the exact reviewed candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import urllib.request,json,os,time
          url='https://api.github.com/repos/hengtong320/notionweb/actions/runs/'+os.environ['CANDIDATE_RUN']
          for i in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              r=json.load(urllib.request.urlopen(req,timeout=20))
              assert r['head_sha']==os.environ['CANDIDATE_SHA']
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  break
              if i==71:raise RuntimeError('Candidate has not passed')
              time.sleep(10)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: atlas25-runtime
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          path: /tmp/runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas25-*-*
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          path: /tmp/results
      - name: Validate immutable data and publish exact tested runtime
        run: |
          python atlas25-publish/publish.py
          mkdir -p atlas25-publish/verified-tests
          cp /tmp/runtime/atlas25-repair/*.cjs atlas25-publish/verified-tests/
          test -z "$(git diff -- fullbody-tcm-v24/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v25 atlas25-publish/verified-tests
          git commit -m 'Publish V25 fixed-landmark skin paths and reviewed antialiased ink'
          git push origin HEAD:main
  public:
    needs: publish
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER: ${{ matrix.browser }}
      NODE_PATH: /tmp/a25/node_modules
      TEST_URL: https://hengtong320.github.io/notionweb/anatomy/?v=25.0.0
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install exact tested browser
        run: |
          npm install --prefix /tmp/a25 playwright@1.56.1 pngjs@7.0.0
          /tmp/a25/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify activated entrance and public runtime digest
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json,hashlib,os,time
          base='https://hengtong320.github.io/notionweb/'
          expected=json.loads(Path('fullbody-tcm-v25/release.json').read_text())['bundleSHA256']
          for i in range(72):
              try:
                  bust='?verify='+str(time.time_ns())
                  def get(name):return urllib.request.urlopen(urllib.request.Request(base+name+bust,headers={'Cache-Control':'no-cache'}),timeout=20).read()
                  assert '../fullbody-tcm-v25/' in get('anatomy/').decode(),'Fixed entry not yet activated'
                  assert json.loads(get('fullbody-tcm-v25/release.json'))['sourceCommit']==os.environ['CANDIDATE_SHA']
                  assert hashlib.sha256(get('fullbody-tcm-v25/app.bundle.js')).hexdigest()==expected,'Public bundle differs'
                  Path('fullbody-tcm-v25/checks/live-content-'+os.environ['BROWSER']+'.json').write_text(json.dumps({'success':True,'version':'25.0.0','bundleSHA256':expected,'checkedAt':time.time()},indent=2))
                  break
              except Exception as e:
                  print('Waiting for matching public deployment:',e,flush=True)
                  if i==71:raise
                  time.sleep(10)
          PY
      - name: Public before-after curves, point anchors, screenshots and high-DPI ink
        run: node atlas25-publish/verified-tests/quality.cjs
      - name: Public normal-depth skin, point correspondence and gender roundtrip
        if: '!cancelled()'
        run: node atlas25-publish/verified-tests/prior-verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas25-public-${{ matrix.browser }}
          path: |
            fullbody-tcm-v25/checks/quality-live-*
            fullbody-tcm-v25/checks/geometry-live-*
            fullbody-tcm-v25/checks/live-content-*
          retention-days: 14
