name: Publish verified ankle release
on:
  push:
    paths:
      - 'ankle-release-tools/**'
      - '.github/workflows/publish-ankle-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ankle-release-publication
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/ankle-release/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ankle-atlas-offline-verification
          run-id: 35624709689
          github-token: ${{ github.token }}
          path: /tmp/ankle-passed
      - name: Import only the artifact that passed all 87 interactions
        run: |
          git pull --ff-only origin main
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          p=Path('/tmp/ankle-passed')
          r=json.loads((p/'qa/offline-report.json').read_text())
          assert r['success'] and len(r['checks'])==87 and all(c['pass'] for c in r['checks'])
          shutil.copytree(p,'ankle-atlas',dirs_exist_ok=True)
          PY
      - name: Install pinned build and verification tools
        run: |
          npm install --prefix /tmp/ankle-release three@0.180.0 esbuild@0.25.10 playwright@1.56.1
          /tmp/ankle-release/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Synchronize region rendering and rebuild self-contained HTML
        run: python ankle-release-tools/finalize.py
      - name: Verify final graphics, all regions and WebKit offline
        run: |
          node - <<'JS'
          const fs=require('fs'),path=require('path'),assert=require('assert'),crypto=require('crypto'),{chromium,webkit}=require('playwright');
          const results=[],errors=[];
          (async()=>{
            for(const [name,engine] of [['chromium',chromium],['webkit',webkit]]){
              const b=await engine.launch({headless:true,...(name==='chromium'?{args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']}:{})});
              try{
                const c=await b.newContext({viewport:{width:1440,height:960},serviceWorkers:'block'});
                await c.route('**/*',r=>/^https?:/.test(r.request().url())?r.abort():r.continue());
                const p=await c.newPage();p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
                await p.goto('file://'+path.resolve('ankle-atlas/index.html'));
                await p.waitForFunction(()=>window.__FOOT_ATLAS__?.getState().ready,undefined,{timeout:45000});
                for(const region of ['leg','ankle','foot']){
                  await p.locator('[data-region="'+region+'"]').click();
                  await p.evaluate(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))));
                  const s=await p.evaluate(()=>window.__FOOT_ATLAS__.getState());
                  assert(s.count===30&&s.visible===(region==='foot'?28:30));
                  results.push({browser:name,region,count:s.count,visible:s.visible,pass:true});
                  await p.screenshot({path:'ankle-atlas/qa/final-'+name+'-'+region+'.png'});
                }
                await p.locator('[data-select="tibia"]').click();
                assert((await p.evaluate(()=>window.__FOOT_ATLAS__.getState())).region==='leg');
                results.push({browser:name,check:'Select tibia from foot scope reveals complete lower leg',pass:true});
              }finally{await b.close();}
            }
            assert(errors.length===0,JSON.stringify(errors));
            const hash=crypto.createHash('sha256').update(fs.readFileSync('ankle-atlas/index.html')).digest('hex');
            fs.writeFileSync('ankle-atlas/qa/final-render-check.json',JSON.stringify({success:true,checkedAt:new Date().toISOString(),htmlSHA256:hash,results,errors,externalNetworkBlocked:true},null,2));
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
      - name: Publish new atlas without rebasing old screenshot commits
        run: |
          test -z "$(git diff 31d013bc909f0846beaa384cad647f12db8f7aa6 -- foot-atlas/)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ankle-atlas/
          git commit -m 'Publish final ankle atlas from verified artifact; preserve original foot atlas'
          git push origin HEAD:main
      - name: Wait for matching GitHub Pages release
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          target=hashlib.sha256(Path('ankle-atlas/index.html').read_bytes()).hexdigest()
          for attempt in range(48):
              try:
                  with urllib.request.urlopen('https://hengtong320.github.io/notionweb/ankle-atlas/?release='+target[:16]+'&attempt='+str(attempt),timeout=20) as response:data=response.read()
                  if hashlib.sha256(data).hexdigest()==target:break
              except Exception as error:print(error,flush=True)
              time.sleep(5)
          else:raise RuntimeError('Pages release checksum does not match')
          print('LIVE_CHECKSUM_MATCH',target)
          PY
      - name: Run all interactions against the public URL
        env:
          ATLAS_LIVE_URL: https://hengtong320.github.io/notionweb/ankle-atlas/?release=${{ github.run_id }}
        run: node ankle-atlas/verify.cjs
      - name: Publish final test evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ankle-atlas/qa/
          if ! git diff --cached --quiet; then
            git commit -m 'Record final ankle atlas live browser verification'
            git push origin HEAD:main
          fi
      - name: Export final release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankle-atlas-final-release
          path: ankle-atlas/
          retention-days: 14
