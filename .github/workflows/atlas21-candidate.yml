name: Verify V21 layers and female coverage
on:
  push:
    paths: ['atlas21-repair/**', '.github/workflows/atlas21-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas21-candidate
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/a21/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build isolated V21 from published V20
        run: |
          python atlas21-repair/patch.py
          python atlas21-repair/finalize.py
          python atlas21-repair/interaction-review.py
      - name: Install pinned renderer and browser
        run: |
          npm install --prefix /tmp/a21 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a21/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Compile and record exact source and bundle hashes
        run: |
          node --check atlas21-repair/verify.cjs
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v21/app.js'],outfile:'fullbody-tcm-v21/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path('fullbody-tcm-v21')
          hashes={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}
          (p/'build-info.json').write_text(json.dumps({'version':'21.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'sha256':hashes,'clinicalCalibration':False,'femaleSupplement':'explicit shared teaching reference with native female pelvis'},indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v20/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Real UI, mesh-coverage, skin and gender-roundtrip tests
        run: node atlas21-repair/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas21-${{ matrix.browser }}
          path: |
            fullbody-tcm-v21/
            atlas21-repair/
          retention-days: 14
