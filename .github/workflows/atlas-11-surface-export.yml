name: Export verified regional surface
on:
  push:
    paths: ['.github/workflows/atlas-11-surface-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-11-source-inspection
          run-id: 35986113102
          github-token: ${{ github.token }}
          path: atlas-systems-11/source
      - name: Export original surface and ear region meshes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          python - <<'PY'
          import urllib.request,zipfile,hashlib
          from pathlib import Path
          b=urllib.request.urlopen('https://raw.githubusercontent.com/Z-Anatomy/Models-of-human-anatomy/master/Z-Anatomy.zip',timeout=120).read()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='f43cabc6f366b2a6058dd2ed4a2b3c7b9b2492cb'
          Path('/tmp/z.zip').write_bytes(b)
          with zipfile.ZipFile('/tmp/z.zip') as z:Path('/tmp/Startup.blend').write_bytes(z.read(next(n for n in z.namelist() if n.endswith('Startup.blend'))))
          PY
          cat > /tmp/export.py <<'PY'
          import sys
          sys.path.append('/usr/lib/python3/dist-packages')
          import numpy,bpy,json,re
          from pathlib import Path
          p=Path('atlas-systems-11/source').resolve()
          bpy.ops.wm.open_mainfile(filepath='/tmp/Startup.blend')
          objs=[o for o in bpy.data.objects if o.type=='MESH']
          names=[o for o in objs if any(c.name=='9: Regions of human body' for c in o.users_collection) and len(o.data.polygons)>0 and not re.search(r'\.(?:g|j|t)(?:\.|$)',o.name) and not any(c.name=='Hairs' for c in o.users_collection)]
          ears=[o for o in names if any(c.name=='Auricular region' for c in o.users_collection)]
          assert len(names)>100 and len(ears)>10
          for c in bpy.data.collections:c.hide_viewport=False;c.hide_render=False
          def export(sel,name):
            bpy.ops.object.select_all(action='DESELECT')
            for o in sel:o.hide_set(False);o.hide_viewport=False;o.select_set(True)
            bpy.context.view_layer.objects.active=sel[0]
            bpy.ops.export_scene.gltf(filepath=str(p/name),export_format='GLB',use_selection=True,export_apply=True,export_yup=True,export_materials='NONE',export_normals=True,export_draco_mesh_compression_enable=False)
            assert (p/name).stat().st_size>1000
          export(names,'skin-original.glb');export(ears,'ear-original.glb')
          (p/'surface-inspection.json').write_text(json.dumps({'kind':'regional body surface, not histological skin','skin':[o.name for o in names],'ears':[o.name for o in ears],'sourceZipBlob':'f43cabc6f366b2a6058dd2ed4a2b3c7b9b2492cb','blenderVersion':bpy.app.version_string,'clinicalCalibration':False},indent=2))
          PY
          blender -b --python-exit-code 1 --python /tmp/export.py
          test -s atlas-systems-11/source/skin-original.glb
          test -s atlas-systems-11/source/ear-original.glb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-11-surface-ready
          path: atlas-systems-11/source/
          retention-days: 14
