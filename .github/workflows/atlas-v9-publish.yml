name: Publish V9 research website
on:
  push:
    paths:
      - 'atlas-v9-publish/**'
      - '.github/workflows/atlas-v9-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-v9-publish
  cancel-in-progress: true
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/atlas-v9-node/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact V9 source without changing V8
        run: |
          python atlas-v9-publish/restore.py
          node --check fullbody-tcm-v9/learning-enhancements.js
          node --check fullbody-tcm-v9/evidence-ui-v9.js
          node --check fullbody-tcm-v9/route-geometry-v9.js
          node --check atlas-v9-publish/verify.cjs
      - name: Install pinned renderer and actual browser engines
        run: |
          npm install --prefix /tmp/atlas-v9-node three@0.180.0 esbuild@0.25.10 playwright@1.56.1
          /tmp/atlas-v9-node/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Bundle online entry with embedded bone model
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),esbuild=require('esbuild');
          const root='fullbody-tcm-v9';
          esbuild.buildSync({entryPoints:[root+'/app.js'],bundle:true,minify:true,format:'iife',target:['es2020'],loader:{'.txt':'text'},nodePaths:[process.env.NODE_PATH],outfile:root+'/app.bundle.js',legalComments:'inline'});
          let html=fs.readFileSync(root+'/index.template.html','utf8');
          html=html.replace('<link rel="stylesheet" href="styles.css">',()=>'<style>'+fs.readFileSync(root+'/styles.css','utf8')+'</style>');
          html=html.replace(/<script type="importmap">[\s\S]*?<\/script>/g,'');
          const bone=fs.readFileSync(root+'/assets/fullbody.glb').toString('base64');
          const bundle=fs.readFileSync(root+'/app.bundle.js','utf8').replace(/<\/script/gi,'<\\/script');
          html=html.replace('<script type="module" src="app.js"></script>',()=>'<script>window.FOOT_ATLAS_EMBEDDED='+JSON.stringify(bone)+';</script>\n<script>'+bundle+'</script>');
          if(html.includes('src="app.js"')||!html.includes('FOOT_ATLAS_EMBEDDED'))throw Error('Unexpected V9 template');
          fs.writeFileSync(root+'/index.html',html);
          const info=JSON.parse(fs.readFileSync(root+'/build-info.json','utf8'));
          info.htmlSHA256=crypto.createHash('sha256').update(html).digest('hex');info.htmlBytes=Buffer.byteLength(html);
          fs.writeFileSync(root+'/build-info.json',JSON.stringify(info,null,2));console.log(info.htmlSHA256,info.htmlBytes);
          JS
      - name: Chromium actual 3D rendering, controls and evidence-page checks
        run: node atlas-v9-publish/verify.cjs
      - name: WebKit compatibility and same-source model checks
        env:
          BROWSER: webkit
        run: node atlas-v9-publish/verify.cjs
      - name: Verify all previous viewer files remain unchanged
        run: |
          test -z "$(git diff HEAD -- foot-atlas ankle-atlas knee-atlas hip-atlas lumbar-atlas fullbody-atlas fullbody-tcm-atlas fullbody-tcm-v3 fullbody-tcm-v4 fullbody-tcm-v5 fullbody-tcm-v6 fullbody-tcm-v7 fullbody-tcm-v8)"
      - name: Publish only browser-tested V9 directory
        run: |
          git fetch origin main
          git worktree add -B atlas-v9-release /tmp/atlas-v9-release origin/main
          test ! -e /tmp/atlas-v9-release/fullbody-tcm-v9
          cp -a fullbody-tcm-v9 /tmp/atlas-v9-release/fullbody-tcm-v9
          cd /tmp/atlas-v9-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v9/
          git commit -m 'Publish V9 research anatomy viewer and searchable evidence companion'
          git push origin HEAD:main
      - name: Confirm public Pages serves the exact tested viewer and evidence page
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          root=Path('fullbody-tcm-v9')
          expected={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ['index.html','evidence.html']}
          for i in range(90):
              try:
                  ready=True
                  for name,digest in expected.items():
                      u='https://hengtong320.github.io/notionweb/fullbody-tcm-v9/'+name+'?verify='+digest[:12]+'&attempt='+str(i)
                      with urllib.request.urlopen(u,timeout=25) as r:body=r.read()
                      ready=ready and hashlib.sha256(body).hexdigest()==digest
                  if ready:
                      print('PUBLISHED_EXACT',expected,flush=True)
                      break
              except Exception as e:print(i,str(e),flush=True)
              time.sleep(5)
          else:raise RuntimeError('Pages has not served the exact two tested pages')
          PY
      - name: Repeat all functional checks on the real public website
        env:
          LIVE_URL: https://hengtong320.github.io/notionweb/fullbody-tcm-v9/?release=${{ github.run_id }}
        run: node atlas-v9-publish/verify.cjs
      - name: Record verified live delivery without modifying application files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          root=Path('fullbody-tcm-v9');reports={}
          for kind in ['local-chromium','local-webkit','live-chromium']:
              r=json.loads((root/'checks'/(kind+'.json')).read_text())
              assert r['success'] and all(c['pass'] for c in r['checks']),kind
              reports[kind]=r
          info=json.loads((root/'build-info.json').read_text())
          assert info['htmlSHA256']==reports['live-chromium']['htmlSHA256']
          info.update(status='published-and-browser-verified',url=reports['live-chromium']['url'],evidenceURL=reports['live-chromium']['evidenceURL'],checks={k:len(v['checks']) for k,v in reports.items()},checkedAt=reports['live-chromium']['finishedAt'],workflowRun=os.environ['GITHUB_RUN_ID'],browserCoverage='Headless Chromium and WebKit, desktop and phone viewports; not all physical devices',clinicalValidation=False)
          (root/'delivery-release.json').write_text(json.dumps(info,ensure_ascii=False,indent=2))
          PY
          cp -a fullbody-tcm-v9/checks/. /tmp/atlas-v9-release/fullbody-tcm-v9/checks/
          cp fullbody-tcm-v9/delivery-release.json /tmp/atlas-v9-release/fullbody-tcm-v9/
          cd /tmp/atlas-v9-release
          git add fullbody-tcm-v9/checks/ fullbody-tcm-v9/delivery-release.json
          git commit -m 'Record verified V9 public viewer and evidence-page delivery'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Export exact viewer and real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v9-web-release
          path: |
            fullbody-tcm-v9/
            atlas-v9-publish/
          retention-days: 14
