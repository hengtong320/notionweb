name: Inspect V25 learning experience
on:
  push:
    paths: ['.github/workflows/atlas26-inspect.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {NODE_PATH: /tmp/a26/node_modules, BROWSER: chromium}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fullbody-tcm-v25
            fullbody-tcm-v9/assets
            fullbody-tcm-v11/assets
            fullbody-tcm-v12/assets
            atlas26-repair
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the pinned test browser
        run: |
          npm install --prefix /tmp/a26 playwright@1.56.1
          /tmp/a26/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual current-release interactions
        run: node atlas26-repair/inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas26-baseline-inspection
          path: atlas26-inspection/
          retention-days: 14
