name: Publish verified V26 reading
on:
  push:
    paths: ['.github/workflows/atlas26-publish.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: atlas26-publish
  cancel-in-progress: false
env:
  CANDIDATE_RUN: '36844476572'
  CANDIDATE_SHA: '2c71e08de4a722b796048caa75c670adbf5de616'
jobs:
  publish:
    permissions: {contents: write, actions: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Require the reviewed candidate to pass in both engines
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/hengtong320/notionweb/actions/runs/'+os.environ['CANDIDATE_RUN']
          for i in range(60):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              r=json.load(urllib.request.urlopen(req,timeout=20))
              assert r['head_sha']==os.environ['CANDIDATE_SHA']
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  break
              if i==59:raise RuntimeError('Candidate not yet verified')
              time.sleep(10)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: atlas26-chromium
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          path: /tmp/atlas26-chromium
      - uses: actions/download-artifact@v4
        with:
          name: atlas26-webkit
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          path: /tmp/atlas26-webkit
      - name: Publish exact tested version without touching V25
        run: |
          python atlas26-publish/publish.py
          test -z "$(git diff -- fullbody-tcm-v25/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v26 atlas26-publish/verified-tests
          git commit -m 'Publish reviewed V26 skin strokes and point-reading workspace'
          git push origin HEAD:main
  public:
    needs: publish
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_PATH: /tmp/a26/node_modules
      BROWSER: ${{ matrix.browser }}
      TEST_URL: https://hengtong320.github.io/notionweb/anatomy/?v=26.0.0
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the same real browser
        run: |
          npm install --prefix /tmp/a26 playwright@1.56.1 pngjs@7.0.0
          /tmp/a26/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify activated entry and public bundle digest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request,time,os
          base='https://hengtong320.github.io/notionweb/'
          expected=json.loads(Path('fullbody-tcm-v26/release.json').read_text())['bundleSHA256']
          for i in range(60):
              try:
                  query='?verify='+str(time.time_ns())
                  def get(p):return urllib.request.urlopen(urllib.request.Request(base+p+query,headers={'Cache-Control':'no-cache'}),timeout=20).read()
                  assert '../fullbody-tcm-v26/' in get('anatomy/').decode(),'Entry not activated'
                  assert json.loads(get('fullbody-tcm-v26/release.json'))['sourceCommit']==os.environ['CANDIDATE_SHA']
                  assert hashlib.sha256(get('fullbody-tcm-v26/app.bundle.js')).hexdigest()==expected,'Public bundle mismatch'
                  Path('fullbody-tcm-v26/checks/live-content-'+os.environ['BROWSER']+'.json').write_text(json.dumps({'success':True,'version':'26.0.0','bundleSHA256':expected,'checkedAt':time.time()},indent=2))
                  break
              except Exception as e:
                  print('Waiting for verified public content:',str(e),flush=True)
                  if i==59:raise
                  time.sleep(10)
          PY
      - name: Public stroke and actual point-reading journeys
        run: node atlas26-publish/verified-tests/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas26-public-${{ matrix.browser }}
          path: fullbody-tcm-v26/checks/live-*
          retention-days: 14
