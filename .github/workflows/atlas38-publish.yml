name: Publish V38 120 daily postures and body burden
on:
  push:
    paths:
      - 'atlas38-tools/**'
      - '.github/workflows/atlas38-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas38-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas38-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas38-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas38-build/node_modules node atlas38-tools/build.cjs
          node --check fullbody-tcm-v38/app.bundle.js
          node --check fullbody-tcm-v38/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: 0e73894ae4b6eb9fca6b2e899cbc3cb74cf31e562916347c1a3caf6233616f35
          EXPECTED_POSE: 2cc0efcf0c78dc9bb79f7d839ee7f94d0e5c06d533ab22d25a3049a6f6d45347
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v38')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          for name,sha in json.loads((d/'build-info.json').read_text())['files'].items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v37' in s or 'fullbody-tcm-v38' in s
          p.write_text(s.replace('fullbody-tcm-v37','fullbody-tcm-v38').replace('37.0.0','38.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v37 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v38 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V38 120 daily postures, joint constraints and source-backed load interpretation"
          git push origin HEAD:main
