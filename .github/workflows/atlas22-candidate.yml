name: Verify V22 interaction edge cases
on:
  push:
    paths: ['atlas22-repair/**', '.github/workflows/atlas22-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas22-candidate
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/a22/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build versioned repair without modifying V21
        run: |
          python atlas22-repair/patch.py
          python atlas22-repair/finalize.py
      - name: Install pinned renderer and browser
        run: |
          npm install --prefix /tmp/a22 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a22/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Build new bundle and record source hashes
        run: |
          node --check atlas22-repair/verify.cjs
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v22/app.js'],outfile:'fullbody-tcm-v22/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path('fullbody-tcm-v22')
          (p/'build-info.json').write_text(json.dumps({'version':'22.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()},'clinicalCalibration':False,'pointRegistrationUnchanged':True},indent=2))
          s=Path('atlas21-repair/verify.cjs').read_text().replace('fullbody-tcm-v21','fullbody-tcm-v22').replace("version:'21.0.0'","version:'22.0.0'")
          s=s.replace("(live?'live-':'local-')+engine","(live?'compatibility-live-':'compatibility-local-')+engine")
          s=s.replace("await p.locator('#v21LayersOpen').click();await settle();await p.locator('#tissuePanel')", "if(!await p.evaluate(()=>document.body.classList.contains('nav-open')&&__ATLAS_SHARED__.getState().section==='layers'))await p.locator('#v21LayersOpen').click();await settle();await p.locator('#tissuePanel')")
          Path('atlas22-repair/compatibility.cjs').write_text(s)
          PY
          test -z "$(git diff -- fullbody-tcm-v21/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Reproduce old V21 edge cases before testing repair
        if: matrix.browser == 'chromium'
        env: {BASELINE: '1'}
        run: node atlas22-repair/verify.cjs
      - name: New queued-save and body-edge regression
        run: node atlas22-repair/verify.cjs
      - name: Original model coverage and skin regressions
        if: '!cancelled()'
        run: node atlas22-repair/compatibility.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas22-${{ matrix.browser }}
          path: |
            fullbody-tcm-v22/
            atlas22-repair/
          retention-days: 14
