name: Prepare V13 build tools
on:
  push:
    paths: ['.github/workflows/atlas13-build-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned build dependencies
        run: |
          mkdir -p /tmp/atlas13-tools
          cd /tmp/atlas13-tools
          npm install three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          tar -czf /tmp/atlas13-node-tools.tgz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlas13-node-tools
          path: /tmp/atlas13-node-tools.tgz
          retention-days: 14
