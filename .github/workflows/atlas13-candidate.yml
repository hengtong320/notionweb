name: V13 continuity and route candidate
on:
  push:
    paths: ['.github/workflows/atlas13-candidate.yml','atlas13-tools/review*.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas13-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/atlas13/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified source transfer
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,gzip,base64
          p=pathlib.Path('atlas13-tools')
          data=gzip.decompress(base64.b64decode(''.join((p/('source.'+str(i))).read_text().strip() for i in range(4))))
          assert hashlib.sha256(data).hexdigest()=='aa93d4e016e920595aedc2548693f84215f32da80e5366cd212752f00a21a06f'
          for name,content in json.loads(data).items():(p/name).write_text(content)
          PY
      - name: Install pinned geometry and browser tools
        run: |
          npm install --prefix /tmp/atlas13 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          /tmp/atlas13/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build additive application
        run: |
          python atlas13-tools/patch.py
          for f in atlas13-tools/review*.py; do test ! -f "$f" || python "$f"; done
          node atlas13-tools/build.cjs
          test -z "$(git diff HEAD -- fullbody-tcm-v12/ fullbody-tcm-v11/ fullbody-tcm-v9/ anatomy/)"
      - uses: actions/download-artifact@v4
        with:
          name: atlas13-corrected-voice
          run-id: 36010769806
          github-token: ${{ github.token }}
          path: fullbody-tcm-v13/voice-corrected
      - name: Chromium actual journeys and projection inspection
        run: node atlas13-tools/verify.cjs
      - name: WebKit actual journeys and projection inspection
        if: success() || failure()
        env:
          BROWSER: webkit
        run: node atlas13-tools/verify.cjs
      - name: Export candidate and real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas13-candidate
          path: |
            fullbody-tcm-v13/
            atlas13-tools/*.py
            atlas13-tools/*.js
            atlas13-tools/*.cjs
            atlas13-tools/*.css
          retention-days: 14
