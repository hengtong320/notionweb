name: Publish V47 surface deformation and view controls
on:
  push:
    paths:
      - 'atlas47-tools/**'
      - '.github/workflows/atlas47-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas47-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas47-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas47-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas47-build/node_modules node atlas47-tools/build.cjs
          node --check fullbody-tcm-v47/app.bundle.js
          node --check fullbody-tcm-v47/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: 5c7acd2cd3f6d3163bdd63e6ae9b572573cc05770a3ab8a7289addc31c62308d
          EXPECTED_POSE: e77fd110bf6d1283bcff912d873fa168cb965b42422d2e8d1431576252a27b1c
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v47')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          expected=json.loads(pathlib.Path('atlas47-tools/reviewed-files.json').read_text())
          assert json.loads((d/'build-info.json').read_text())['files']==expected
          for name,sha in expected.items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v46' in s or 'fullbody-tcm-v47' in s
          p.write_text(s.replace('fullbody-tcm-v46','fullbody-tcm-v47').replace('46.0.0','47.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v46 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v47 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V47 surface deformation and view controls"
          git push origin HEAD:main
