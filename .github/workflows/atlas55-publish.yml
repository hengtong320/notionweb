name: Publish V55 observation gestures and saved state restoration
on:
  push:
    paths:
      - 'atlas55-tools/**'
      - '.github/workflows/atlas55-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas55-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas55-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas55-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas55-build/node_modules node atlas55-tools/build.cjs
          node --check fullbody-tcm-v55/app.bundle.js
          node --check fullbody-tcm-v55/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: 603450d700b74ce7445c20ee9a0bf09153fe84d0eeda2e3aedacbe2733d5898b
          EXPECTED_POSE: ef1889d7eab0851653a245b4288b77b73a660b52bb7b5655d2a16771e290fa7e
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v55')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          expected=json.loads(pathlib.Path('atlas55-tools/reviewed-files.json').read_text())
          actual=json.loads((d/'build-info.json').read_text())['files']
          differences={name:{'local':expected.get(name),'build':sha} for name,sha in actual.items() if sha!=expected.get(name)}
          print('Reviewed file differences:',json.dumps(differences))
          assert actual==expected
          for name,sha in expected.items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v54' in s or 'fullbody-tcm-v55' in s
          p.write_text(s.replace('fullbody-tcm-v54','fullbody-tcm-v55').replace('54.0.0','55.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v54 fullbody-tcm-v53 fullbody-tcm-v52 fullbody-tcm-v51 fullbody-tcm-v50 fullbody-tcm-v49 fullbody-tcm-v48 fullbody-tcm-v47 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v55 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V55 observation gestures and saved state restoration"
          git push origin HEAD:main
