name: Verify V25 skin curves and ink
on:
  push:
    paths: ['atlas25-repair/**', '.github/workflows/atlas25-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas25-candidate
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build only the new version and immutable-data checks
        run: |
          python atlas25-repair/patch.py
          python atlas25-repair/finish.py
          npm install --prefix /tmp/a25 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/a25/node_modules node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v25/app.js'],outfile:'fullbody-tcm-v25/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          for f in atlas25-repair/*.cjs; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('fullbody-tcm-v25')
          d={'version':'25.0.0','sourceCommit':os.environ['GITHUB_SHA'],'candidateRun':os.environ['GITHUB_RUN_ID'],'clinicalCalibration':False,'numberedAnchorDataUnchanged':True,'sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}}
          (p/'build-info.json').write_text(json.dumps(d,indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v24/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas25-runtime
          path: |
            fullbody-tcm-v25/
            atlas25-repair/
          retention-days: 14
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite: [quality, selection, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/a25/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: atlas25-runtime}
      - name: Install pinned browser and image test dependency
        run: |
          npm install --prefix /tmp/a25 playwright@1.56.1 pngjs@7.0.0
          /tmp/a25/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Real curve comparison, screenshots, normal-depth ink and high-DPI tests
        if: matrix.suite == 'quality'
        run: |
          node atlas25-repair/quality.cjs
          node atlas25-repair/prior-verify.cjs
      - name: Existing selection, view restoration and switching tests
        if: matrix.suite == 'selection'
        run: |
          node atlas25-repair/prior-prior-verify.cjs
          node atlas25-repair/prior-prior-prior-interactions.cjs
      - name: Existing actual model coverage, layers and skin tests
        if: matrix.suite == 'coverage'
        run: node atlas25-repair/prior-prior-compatibility.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas25-${{ matrix.browser }}-${{ matrix.suite }}
          path: fullbody-tcm-v25/checks/
          retention-days: 14
