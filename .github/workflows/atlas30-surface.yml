name: Verify surface contact and switching
on:
  push:
    paths: ['.github/workflows/atlas30-surface.yml','atlas30-repair/**']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas30-surface
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    env:
      NODE_PATH: /tmp/a30/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned test environment
        run: |
          npm install --prefix /tmp/a30 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a30/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Reproduce current public-version behavior
        env: {ATLAS_VERSION: '29', ALLOW_BASELINE_FAILURE: '1'}
        run: node atlas30-repair/probe.cjs
      - name: Build and verify candidate when present
        run: |
          if test -f atlas30-repair/patch.py; then
            python atlas30-repair/patch.py
            node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v30/app.js'],outfile:'fullbody-tcm-v30/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
            ATLAS_VERSION=30 node atlas30-repair/probe.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas30-${{ matrix.browser }}
          path: |
            atlas30-evidence/
            fullbody-tcm-v30/
            atlas30-repair/
          retention-days: 14
