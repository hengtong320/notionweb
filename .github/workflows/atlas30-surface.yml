name: Verify surface contact and switching
on:
  push:
    paths: ['.github/workflows/atlas30-surface.yml','atlas30-repair/**']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: atlas30-surface
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    env:
      NODE_PATH: /tmp/a30/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: atlas29-chromium
          run-id: 36958715022
          github-token: ${{ github.token }}
          path: /tmp/atlas29-tested
      - name: Install pinned test environment
        run: |
          npm install --prefix /tmp/a30 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a30/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Prepare exact journeys
        run: |
          python atlas30-repair/prepare-tests.py
          node --check atlas30-repair/probe.cjs
      - name: Reproduce current V29 behavior
        env: {ATLAS_VERSION: '29', ALLOW_BASELINE_FAILURE: '1'}
        run: node atlas30-repair/probe.cjs
      - name: Build V30 without changing original sources
        run: |
          python atlas30-repair/patch.py
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v30/app.js'],outfile:'fullbody-tcm-v30/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path('fullbody-tcm-v30')
          (p/'build-info.json').write_text(json.dumps({'version':'30.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'files':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()},'clinicalCalibration':False},indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v29/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: V30 contact pixels and combined side and sex operations
        env: {ATLAS_VERSION: '30'}
        run: node atlas30-repair/probe.cjs
      - name: Previous 44 surface-switch regressions
        if: '!cancelled()'
        env: {ATLAS_VERSION: '30'}
        run: node atlas30-repair/prior-surface-regression.cjs
      - name: Previous 28 observation regressions
        if: '!cancelled()'
        env: {ATLAS_VERSION: '30'}
        run: node atlas30-repair/prior-observation-regression.cjs
      - name: Previous 14 opaque-skin regressions
        if: '!cancelled()'
        env: {ATLAS_VERSION: '30'}
        run: node atlas30-repair/prior-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas30-${{ matrix.browser }}
          path: |
            atlas30-evidence/
            atlas29-evidence/
            fullbody-tcm-v30/
            atlas30-repair/
          retention-days: 14
