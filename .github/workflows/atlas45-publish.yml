name: Publish V45 evidence-based duration explanations
on:
  push:
    paths:
      - 'atlas45-tools/**'
      - '.github/workflows/atlas45-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas45-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas45-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas45-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas45-build/node_modules node atlas45-tools/build.cjs
          node --check fullbody-tcm-v45/app.bundle.js
          node --check fullbody-tcm-v45/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: bf549a178a287e358a569e4f64f5a7dcf7588747eab62ff10e81fef06bbf0133
          EXPECTED_POSE: 7927b5fcd2fda063f38396060ed5fd6a0921f87d5c26b96cc6dc78319f8bb316
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v45')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          for name,sha in json.loads((d/'build-info.json').read_text())['files'].items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v44' in s or 'fullbody-tcm-v45' in s
          p.write_text(s.replace('fullbody-tcm-v44','fullbody-tcm-v45').replace('44.0.0','45.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v44 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v45 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V45 body evidence-based duration explanations"
          git push origin HEAD:main
