name: Reproduce V18 opaque skin and switching
on:
  push:
    paths: ['.github/workflows/atlas19-diagnose.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {NODE_PATH: /tmp/a19/node_modules}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --prefix /tmp/a19 playwright@1.56.1
          /tmp/a19/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: node atlas19-repair/diagnose.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas19-diagnostics
          path: atlas19-repair/diagnostics
          retention-days: 7
