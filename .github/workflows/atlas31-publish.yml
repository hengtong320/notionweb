name: Publish V31 surface consistency
on:
  push:
    paths: ['.github/workflows/atlas31-publish.yml']
  workflow_dispatch:
permissions: {contents: write, actions: read}
concurrency:
  group: atlas31-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Require completed two-browser candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import urllib.request,json,time,os
          url='https://api.github.com/repos/hengtong320/notionweb/actions/runs/36991720390'
          for attempt in range(60):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              d=json.load(urllib.request.urlopen(req,timeout=25))
              assert d['head_sha']=='55e515814792204896da59349993701a6cee84a3'
              if d['status']=='completed':
                  assert d['conclusion']=='success',d['conclusion']
                  break
              if attempt==59:raise RuntimeError('Candidate still incomplete')
              time.sleep(10)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: atlas31-chromium
          run-id: 36991720390
          github-token: ${{ github.token }}
          path: /tmp/verified31-chromium
      - uses: actions/download-artifact@v4
        with:
          name: atlas31-webkit
          run-id: 36991720390
          github-token: ${{ github.token }}
          path: /tmp/verified31-webkit
      - name: Publish exact verified version and preserve V30
        run: |
          git pull --ff-only origin main
          python atlas31-publish/publish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v31 atlas31-publish/verified-tests
          git commit -m 'Publish V31 verified opaque-skin side and body-switch consistency'
          git push origin HEAD:main
  public:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    env:
      NODE_PATH: /tmp/a31/node_modules
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the verified browser engine
        run: |
          npm install --prefix /tmp/a31 playwright@1.56.1 pngjs@7.0.0
          /tmp/a31/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify public fixed entry and exact runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json,time,hashlib,os
          base='https://hengtong320.github.io/notionweb/'
          local=json.loads(Path('fullbody-tcm-v31/build-info.json').read_text())
          for attempt in range(48):
              try:
                  stamp='?check='+str(time.time_ns())
                  def get(p):return urllib.request.urlopen(urllib.request.Request(base+p+stamp,headers={'Cache-Control':'no-cache'}),timeout=25).read()
                  assert '../fullbody-tcm-v31/' in get('anatomy/').decode(),'Fixed entrance not activated'
                  actual={}
                  for name in ['app.bundle.js','meridian-ux-v26.css','reading-v26.css']:
                      actual[name]=hashlib.sha256(get('fullbody-tcm-v31/'+name)).hexdigest()
                      assert actual[name]==local['files'][name],name
                  dest=Path('atlas31-live');dest.mkdir(exist_ok=True)
                  (dest/('public-content-'+os.environ['BROWSER']+'.json')).write_text(json.dumps({'success':True,'version':'31.0.0','files':actual,'entry':'anatomy/','checkedAt':time.time()},indent=2))
                  break
              except Exception as e:
                  print('Waiting for verified deployment:',e,flush=True)
                  if attempt==47:raise
                  time.sleep(10)
          PY
      - name: Real public male/female skin, pixels, side, pose and transition checks
        env:
          ATLAS_VERSION: '31'
          TEST_URL: https://hengtong320.github.io/notionweb/anatomy/?v=31.0.0
          OUT_DIR: atlas31-live
        run: node atlas31-publish/verified-tests/driver.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas31-public-${{ matrix.browser }}
          path: atlas31-live/
          retention-days: 14
