name: Publish V52 grip contact and local viewing
on:
  push:
    paths:
      - 'atlas52-tools/**'
      - '.github/workflows/atlas52-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas52-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas52-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas52-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas52-build/node_modules node atlas52-tools/build.cjs
          node --check fullbody-tcm-v52/app.bundle.js
          node --check fullbody-tcm-v52/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: 160a5599e93e88a163d5c17919cf536e6e9b130ebca5db50dde198f4943c65c7
          EXPECTED_POSE: 0f89cd64472a088bc39b83d490bfe2356503ea17ade1fc4b81c5a781c03be85d
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v52')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          expected=json.loads(pathlib.Path('atlas52-tools/reviewed-files.json').read_text())
          actual=json.loads((d/'build-info.json').read_text())['files']
          differences={name:{'local':expected.get(name),'build':sha} for name,sha in actual.items() if sha!=expected.get(name)}
          print('Reviewed file differences:',json.dumps(differences))
          assert actual==expected
          for name,sha in expected.items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v51' in s or 'fullbody-tcm-v52' in s
          p.write_text(s.replace('fullbody-tcm-v51','fullbody-tcm-v52').replace('51.0.0','52.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v51 fullbody-tcm-v50 fullbody-tcm-v49 fullbody-tcm-v48 fullbody-tcm-v47 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v52 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V52 grip contact and local viewing"
          git push origin HEAD:main
