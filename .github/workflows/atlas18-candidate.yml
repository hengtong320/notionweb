name: Verify V18 body and point registration
on:
  push:
    paths: ['atlas18-delivery/**', '.github/workflows/atlas18-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas18-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/a18/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct reviewed candidate without modifying V17
        run: |
          python - <<'PY'
          import base64,lzma,json,shutil,subprocess
          from pathlib import Path
          p=Path('fullbody-tcm-v18')
          assert not p.exists(),'Refuse to overwrite a published V18'
          shutil.copytree('fullbody-tcm-v17',p)
          shutil.rmtree(p/'checks',ignore_errors=True)
          for name in ['release.json','build-info.json']:
              (p/name).unlink(missing_ok=True)
          parts=''.join(Path('atlas18-delivery/payload.%02d'%i).read_text() for i in range(5))
          assert len(parts)==58028
          obj=json.loads(lzma.decompress(base64.b64decode(parts)))
          assert len(obj)==10
          for name,content in obj.items():
              f=Path(name)
              assert f.parts[0] in ['fullbody-tcm-v18','atlas18-delivery'] and '..' not in f.parts
              f.parent.mkdir(parents=True,exist_ok=True)
              f.write_text(content,encoding='utf-8')
          # Preserve the original no-final-newline HTML files in the unified diff.
          f=Path('atlas18-delivery/source.patch');s=f.read_text()
          assert s.count('</html>+<!doctype')==2
          s=s.replace('</html>+<!doctype','</html>\n\\ No newline at end of file\n+<!doctype')
          s=s.replace('</html>--- a/','</html>\n\\ No newline at end of file\n--- a/')
          Path('atlas18-delivery/source.fixed.patch').write_text(s)
          subprocess.run(['git','apply','--unidiff-zero','atlas18-delivery/source.fixed.patch'],check=True)
          PY
          if test -f atlas18-delivery/fix.py; then python atlas18-delivery/fix.py; fi
      - name: Install pinned graphics and real browsers
        run: |
          npm install --prefix /tmp/a18 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          /tmp/a18/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate source rules and build
        run: |
          node --check atlas18-delivery/verify.cjs
          node atlas18-delivery/validate.cjs
          node atlas18-delivery/build.cjs
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('fullbody-tcm-v18/build-info.json');d=json.loads(p.read_text())
          d.update(sourceCommit=os.environ['GITHUB_SHA'],verificationRun=os.environ['GITHUB_RUN_ID'])
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          test -z "$(git diff HEAD -- fullbody-tcm-v17/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Chromium actual model, meridian, point and female-organ journey
        run: node atlas18-delivery/verify.cjs
      - name: WebKit actual model, meridian, point and female-organ journey
        if: '!cancelled()'
        env: {BROWSER: webkit}
        run: node atlas18-delivery/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas18-candidate
          path: |
            fullbody-tcm-v18/
            atlas18-delivery/
          retention-days: 14
