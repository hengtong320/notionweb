name: Verify V29 opaque surface consistency
on:
  push:
    paths: ['.github/workflows/atlas29-candidate.yml', 'atlas29-repair/**']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: atlas29-candidate
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_PATH: /tmp/a29/node_modules
      ATLAS_VERSION: '29'
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: atlas28-chromium
          run-id: 36904440877
          github-token: ${{ github.token }}
          path: /tmp/atlas28-tested
      - name: Assemble bounded repair
        run: python atlas29-repair/patch.py
      - name: Install pinned graphics and browser
        run: |
          npm install --prefix /tmp/a29 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a29/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Build and hash runtime
        run: |
          node --check atlas29-repair/probe.cjs
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v29/app.js'],outfile:'fullbody-tcm-v29/app.bundle.js',bundle:true,format:'iife',nodePaths:[process.env.NODE_PATH],loader:{'.txt':'text'},minify:true})"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path('fullbody-tcm-v29');sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          d={'version':'29.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'files':{f.name:sha(f) for f in p.iterdir() if f.is_file()},'tests':{f.name:sha(f) for f in Path('atlas29-repair').glob('*.cjs')},'clinicalCalibration':False}
          (p/'build-info.json').write_text(json.dumps(d,indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v28/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: New real-click and opaque-surface consistency regressions
        run: node atlas29-repair/probe.cjs
      - name: All retained V28 body-specific geometry and switching checks
        if: '!cancelled()'
        run: node atlas29-repair/surface-regression.cjs
      - name: Retained camera, label and DPR2 touch observation checks
        if: '!cancelled()'
        run: node atlas29-repair/observation-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas29-${{ matrix.browser }}
          path: |
            fullbody-tcm-v29/
            atlas29-repair/
            atlas29-evidence/
          retention-days: 14
