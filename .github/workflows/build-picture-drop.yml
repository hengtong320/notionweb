name: Build Picture Drop H5 v3.7
on:
  push:
    paths:
      - 'picture-drop/tools/generate_extra_pictures.py'
      - 'picture-drop/tools/patch_v37_progression.py'
      - 'picture-drop/tools/smoke_v37.py'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: picture-drop-build-v37, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate content pack and apply v3.7
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.6.0'
          python picture-drop/tools/generate_extra_pictures.py
          test "$(find picture-drop/assets/pictures-extra -name '*.svg' | wc -l)" -eq 24
          python picture-drop/tools/patch_v37_progression.py
          python - <<'PY'
          from pathlib import Path
          p=Path('picture-drop/game.js');s=p.read_text(encoding='utf-8')
          old='primeDecksForPlayableFrontier};'
          new='primeDecksForPlayableFrontier,resolveBoard,renderBoard,imageCountForLevel,selectedImagesForLevel,levelIntroCopy,pictureCount:PICTURE_PATHS.length};'
          if old in s:s=s.replace(old,new,1)
          elif 'pictureCount:PICTURE_PATHS.length' not in s:raise SystemExit('debug export marker missing')
          p.write_text(s,encoding='utf-8')
          PY
          node --check picture-drop/game.js
          grep -Fq 'assets/pictures-extra/37-jellyfish.svg' picture-drop/game.js
          grep -Fq 'function levelIntroCopy' picture-drop/game.js
          grep -Fq 'pictureCount:PICTURE_PATHS.length' picture-drop/game.js
          grep -Fq 'game.lastResolveTrace.push('\''gravity'\'')' picture-drop/game.js
          grep -Fq 'game.lastResolveTrace.push('\''clear'\'')' picture-drop/game.js
          grep -Fq 'const waveCap=game.level<=2?1:2' picture-drop/game.js
          grep -Fq 'style.css?v=3.7.0' picture-drop/index.html
          grep -Fq 'game.js?v=3.7.0' picture-drop/index.html
          grep -Fq 'jigsaw-drop-h5-v3.7.0' picture-drop/sw.js
          grep -Fq "pictures-extra').glob('*.svg')" picture-drop/tools/build_standalone.py
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.7.0'
      - name: Real browser progression and settle-order tests
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python -m http.server 8765 --directory picture-drop >/tmp/picture-drop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_v37.py
      - name: Preserve v3.6 interaction, gravity and seam regressions
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory picture-drop >/tmp/picture-drop-http2.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          p=Path('picture-drop/tools/smoke_v36.py')
          s=p.read_text(encoding='utf-8').replace('8765','8766').replace('v=3.6.0','v=3.7.0')
          Path('/tmp/smoke_v36_as_v37.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v36_as_v37.py
      - name: Rebuild release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/webp;base64' picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/svg+xml;base64' picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop')
          (r/'release.json').write_text(json.dumps({
            'version':'3.7.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'gravity settles before any merge or clear',
              'transient mid-air complete images cannot clear',
              '60-picture content pool',
              'zero adjacent-level image overlap',
              '5-to-20 image saw-tooth difficulty curve',
              'deeper decks and repeated two-card-per-column deal waves',
              'staged beginner tutorial copy',
              'v3.6 soft gravity/seam/performance retained',
              'v3.5 anti-deadlock and smart hints retained'
            ]
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop && zip -qr /tmp/Jigsaw-Drop-H5-v3.7.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*' && test "$(stat -c%s /tmp/Jigsaw-Drop-H5-v3.7.zip)" -lt 90000000 && mv /tmp/Jigsaw-Drop-H5-v3.7.zip .
      - name: Commit v3.7
        run: |
          set -euo pipefail
          git config user.name 'hengtong320';git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet;then exit 0;fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.7 settle-first progression and 60-picture pool'
          git push origin HEAD:main
