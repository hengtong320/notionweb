name: Build Picture Drop H5 v4.0

on:
  push:
    paths:
      - 'picture-drop/tools/download_v40_realistic_blessings.sh'
      - 'picture-drop/tools/patch_v40_scheme_b.py'
      - 'picture-drop/tools/patch_v40_idempotent_hotfix.py'
      - 'picture-drop/tools/smoke_v40.py'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v40-scheme-b
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply or verify photorealistic Scheme B
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '\r\n ' < picture-drop/VERSION)"
          if [ "$CURRENT" = '3.9.0' ]; then
            bash picture-drop/tools/download_v40_realistic_blessings.sh
            python picture-drop/tools/patch_v40_scheme_b.py
          elif [ "$CURRENT" = '4.0.0' ]; then
            echo 'v4.0 already applied; verifying committed production assets.'
          else
            echo "Unexpected Picture Drop version: $CURRENT" >&2
            exit 1
          fi
          python picture-drop/tools/patch_v40_idempotent_hotfix.py

          test "$(find picture-drop/assets/blessings-realistic -name '*.png' | wc -l)" -eq 6
          node --check picture-drop/game.js
          grep -Fq "assets/blessings-realistic/01-lotus-sunrise.png" picture-drop/game.js
          grep -Fq "assets/blessings-realistic/04-elegant-woman.png" picture-drop/game.js
          grep -Fq 'const REALISTIC_BLESSING_COUNT=6' picture-drop/game.js
          grep -Fq 'function isRealisticBlessingIndex' picture-drop/game.js
          grep -Fq 'realisticBlessingCount:REALISTIC_BLESSING_COUNT' picture-drop/game.js
          grep -Fq 'style.css?v=4.0.0' picture-drop/index.html
          grep -Fq 'game.js?v=4.0.0' picture-drop/index.html
          grep -Fq 'jigsaw-drop-h5-v4.0.0' picture-drop/sw.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '4.0.0'

      - name: Real browser photorealistic puzzle and poster tests
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python -m http.server 8765 --directory picture-drop >/tmp/picture-drop-v40-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_v40.py

      - name: Preserve v3.9 blessing sharing regression
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory picture-drop >/tmp/picture-drop-v39-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v39.py').read_text(encoding='utf-8').replace('8765','8766').replace('v=3.9.0','v=4.0.0')
          Path('/tmp/smoke_v39_as_v40.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v39_as_v40.py

      - name: Preserve v3.8 planning, chain and juice regressions
        run: |
          set -euo pipefail
          python -m http.server 8767 --directory picture-drop >/tmp/picture-drop-v38-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v38.py').read_text(encoding='utf-8').replace('8765','8767').replace('v=3.8.0','v=4.0.0')
          Path('/tmp/smoke_v38_as_v40.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v38_as_v40.py

      - name: Preserve v3.7 progression and settle-first regressions
        run: |
          set -euo pipefail
          python -m http.server 8768 --directory picture-drop >/tmp/picture-drop-v37-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v37.py').read_text(encoding='utf-8').replace('8765','8768').replace('v=3.7.0','v=4.0.0')
          Path('/tmp/smoke_v37_as_v40.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v37_as_v40.py

      - name: Preserve v3.6 drag, gravity and seamless-surface regressions
        run: |
          set -euo pipefail
          python -m http.server 8769 --directory picture-drop >/tmp/picture-drop-v36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v36.py').read_text(encoding='utf-8').replace('8765','8769').replace('v=3.6.0','v=4.0.0')
          Path('/tmp/smoke_v36_as_v40.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v36_as_v40.py

      - name: Rebuild release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/png;base64' picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop')
          (r/'release.json').write_text(json.dumps({
            'version':'4.0.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'Scheme B: six clean text-free photorealistic blessing puzzle bases',
              'sunrise lotus lake, trumpet flowers, jujube orchard, elegant fictional woman, flower vase and pine-crane scenes',
              '1080x1440 generated photographic assets and 1080x1440 share posters',
              'gameplay uses clean photos while completion adds premium blessing typography',
              'per-card title placement, warm gradients, framed composition and restrained sparkles',
              'photo-led blessing entry and refined completed-image lockup',
              'system sharing, PNG saving and blessing-copy flow retained',
              'v3.8 chain/juice, v3.7 progression, v3.6 gravity/seams and anti-deadlock retained'
            ]
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v4.0.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*'
          test "$(stat -c%s /tmp/Jigsaw-Drop-H5-v4.0.zip)" -lt 120000000
          mv /tmp/Jigsaw-Drop-H5-v4.0.zip .

      - name: Commit refreshed v4.0 release files
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m 'Refresh Jigsaw Drop H5 v4.0 Scheme B release files'
          git pull --rebase origin main
          git push origin HEAD:main
