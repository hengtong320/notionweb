name: Build Picture Drop H5 v2.1

on:
  push:
    paths:
      - 'picture-drop/tools/patch_v3.py'
      - 'picture-drop/tools/verify_v21.js'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v21
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v2.1 interaction and gravity patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('picture-drop/tools/patch_v3.py')
          s=p.read_text(encoding='utf-8')
          old="""    marker = f'  function {name}('
              start = src.find(marker)
              if start < 0:
                  raise RuntimeError(f'function not found: {name}')
          """
          new="""    markers = [f'  function {name}(', f'  async function {name}(']
              starts = [src.find(marker) for marker in markers]
              start = min((value for value in starts if value >= 0), default=-1)
              if start < 0:
                  raise RuntimeError(f'function not found: {name}')
          """
          if old not in s:
              raise SystemExit('replace_function helper signature changed unexpectedly')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python picture-drop/tools/patch_v3.py
          node --check picture-drop/game.js
          node picture-drop/tools/verify_v21.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '2.1.0'

      - name: Rebuild offline edition
        shell: bash
        run: |
          set -euo pipefail
          if [ -f picture-drop/tools/build_standalone.py ]; then
            python picture-drop/tools/build_standalone.py
          fi
          test -s picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html

      - name: Build downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f picture-drop/Jigsaw-Drop-H5-v2.1.zip
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v2.1.zip . -x 'Jigsaw-Drop-H5-v2.1.zip'
          mv /tmp/Jigsaw-Drop-H5-v2.1.zip .

      - name: Commit v2.1 game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -s -m 'Release Jigsaw Drop H5 v2.1 interaction overhaul'
          git push origin HEAD:main
