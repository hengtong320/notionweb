name: Build Picture Drop H5 v2

on:
  push:
    paths:
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified v2 source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf picture-drop /tmp/picture-drop-v2.tar.gz
          curl --fail --location --retry 8 --retry-delay 3 \
            'https://jigsaw-drop-game.netlify.app/Jigsaw-Drop-H5-v2.0-source.tar.gz?v=2.0.0' \
            --output /tmp/picture-drop-v2.tar.gz
          gzip -t /tmp/picture-drop-v2.tar.gz
          mkdir -p picture-drop
          tar -xzf /tmp/picture-drop-v2.tar.gz -C picture-drop
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '2.0.0'
          test -s picture-drop/index.html
          test -s picture-drop/style.css
          test -s picture-drop/game.js
          node --check picture-drop/game.js

      - name: Rebuild offline edition
        shell: bash
        run: |
          set -euo pipefail
          if [ -f picture-drop/tools/build_standalone.py ]; then
            python picture-drop/tools/build_standalone.py
          fi
          test -s picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html

      - name: Build downloadable ZIP and release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f picture-drop/Jigsaw-Drop-H5-v1.0.zip picture-drop/Jigsaw-Drop-H5-v2.0.zip
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          root = Path('picture-drop')
          payload = {
              'version': '2.0.0',
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'features': [
                  'splittable joined pieces',
                  'stepwise accelerated gravity',
                  'landing squash and rebound',
                  'mobile viewport and safe-area refinement',
                  'on-demand picture caching'
              ]
          }
          (root / 'release.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v2.0.zip . -x 'Jigsaw-Drop-H5-v2.0.zip'
          mv /tmp/Jigsaw-Drop-H5-v2.0.zip .

      - name: Commit v2 game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -s -m 'Release Jigsaw Drop H5 v2.0 physics and touch upgrade'
          git push origin HEAD:main
