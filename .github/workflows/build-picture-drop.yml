name: Build Picture Drop H5 v3.0

on:
  push:
    paths:
      - 'picture-drop/tools/patch_v30_reference.py'
      - 'picture-drop/tools/verify_v30.js'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v30
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v3 reference-fidelity rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('picture-drop/tools/patch_v30_reference.py')
          s=p.read_text(encoding='utf-8')
          old="""    brace = src.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'opening brace not found: {name}')
          """
          new="""    paren = src.find('(', start)
              if paren < 0:
                  raise RuntimeError(f'opening paren not found: {name}')
              pdepth = 0
              close_paren = -1
              j = paren
              ps = pd = pt = False
              pesc = False
              while j < len(src):
                  ch = src[j]
                  if pesc:
                      pesc = False
                  elif ch == '\\\\':
                      pesc = True
                  elif ps:
                      if ch == \"'\": ps = False
                  elif pd:
                      if ch == '\"': pd = False
                  elif pt:
                      if ch == '`': pt = False
                  else:
                      if ch == \"'\": ps = True
                      elif ch == '\"': pd = True
                      elif ch == '`': pt = True
                      elif ch == '(': pdepth += 1
                      elif ch == ')':
                          pdepth -= 1
                          if pdepth == 0:
                              close_paren = j
                              break
                  j += 1
              if close_paren < 0:
                  raise RuntimeError(f'closing paren not found: {name}')
              brace = src.find('{', close_paren + 1)
              if brace < 0:
                  raise RuntimeError(f'opening brace not found: {name}')
          """
          if old not in s:
              raise SystemExit('v3 replace_function helper changed unexpectedly')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python picture-drop/tools/patch_v30_reference.py
          if ! node --check picture-drop/game.js; then
            nl -ba picture-drop/game.js | sed -n '480,580p'
            exit 1
          fi
          node picture-drop/tools/verify_v30.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.0.0'

      - name: Rebuild offline edition
        shell: bash
        run: |
          set -euo pipefail
          if [ -f picture-drop/tools/build_standalone.py ]; then
            python picture-drop/tools/build_standalone.py
          fi
          test -s picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html

      - name: Build downloadable ZIP and release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f picture-drop/Jigsaw-Drop-H5-v3.0.zip
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          root=Path('picture-drop')
          payload={
            'version':'3.0.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'reference 4x4 to 5x5 level progression',
              'rigid source-group drag with splittable target region',
              'translated region swap including overlapping motion',
              'rigid connected-group gravity waves',
              'per-column physical deck refill',
              'connected-cell gutter bridging',
              'persistent combo streak',
              'hard-level red deck presentation'
            ]
          }
          (root/'release.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v3.0.zip . -x 'Jigsaw-Drop-H5-v3.0.zip'
          mv /tmp/Jigsaw-Drop-H5-v3.0.zip .

      - name: Commit v3 game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.0 reference-fidelity rules'
          git push origin HEAD:main
