name: Build Picture Drop H5 v3.1

on:
  push:
    paths:
      - 'picture-drop/tools/make_portrait_assets.py'
      - 'picture-drop/tools/patch_v31_physics.py'
      - 'picture-drop/tools/verify_v31.js'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v31
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build portrait image set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python picture-drop/tools/make_portrait_assets.py
          test "$(find picture-drop/assets/pictures-portrait -maxdepth 1 -name '*.webp' | wc -l)" -ge 36

      - name: Apply v3.1 portrait physics rules
        shell: bash
        run: |
          set -euo pipefail
          python picture-drop/tools/patch_v31_physics.py
          if ! node --check picture-drop/game.js; then
            nl -ba picture-drop/game.js | sed -n '560,920p'
            exit 1
          fi
          node picture-drop/tools/verify_v31.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.1.0'

      - name: Rebuild offline edition
        shell: bash
        run: |
          set -euo pipefail
          if [ -f picture-drop/tools/build_standalone.py ]; then
            python picture-drop/tools/build_standalone.py
          fi
          test -s picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html

      - name: Build downloadable ZIP and release metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f picture-drop/Jigsaw-Drop-H5-v3.1.zip
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          root=Path('picture-drop')
          payload={
            'version':'3.1.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'portrait 0.69 tile and full-image aspect from reference video',
              'height-driven mobile board layout',
              '4x4 level 14 and 5x5 level 15 progression',
              'direct drag moves a joined source group',
              'hold then drag tears out one joined quarter',
              'invalid group placement can fall back to legal single-quarter tear',
              'target joined groups remain splittable by overlap replacement',
              'gravity resolves after every move even without a clear',
              'rigid connected-group gravity waves',
              'per-column deck refill',
              '690x1000 portrait image asset set'
            ]
          }
          (root/'release.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v3.1.zip . -x 'Jigsaw-Drop-H5-v3.1.zip'
          mv /tmp/Jigsaw-Drop-H5-v3.1.zip .

      - name: Commit v3.1 game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.1 portrait physics fidelity'
          git push origin HEAD:main
