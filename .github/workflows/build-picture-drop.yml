name: Build Picture Drop H5 v4.2

on:
  push:
    paths:
      - 'picture-drop/tools/download_v42_realistic_packs.sh'
      - 'picture-drop/tools/patch_v42_album_packs.py'
      - 'picture-drop/tools/smoke_v42.py'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v42
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image and browser test dependencies
        run: python -m pip install --quiet pillow selenium

      - name: Download and optimize twelve new photorealistic images
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '4.1.0'
          chmod +x picture-drop/tools/download_v42_realistic_packs.sh
          picture-drop/tools/download_v42_realistic_packs.sh
          test "$(find picture-drop/assets/blessings-v42 -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')" = '12'

      - name: Apply v4.2 album, packs and flow refactor
        run: |
          set -euo pipefail
          python picture-drop/tools/patch_v42_album_packs.py
          node --check picture-drop/game.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '4.2.0'
          grep -Fq "const V42_VERSION='4.2.0'" picture-drop/game.js
          grep -Fq 'const REALISTIC_BLESSING_COUNT=18' picture-drop/game.js
          grep -Fq 'renderBlessingAlbum' picture-drop/game.js
          grep -Fq 'assets/blessings-v42/13-heli-red-mountain.webp' picture-drop/game.js
          grep -Fq '写实祝福合辑' picture-drop/index.html
          grep -Fq 'id="blessingPackModal"' picture-drop/index.html
          grep -Fq 'style.css?v=4.2.0' picture-drop/index.html
          grep -Fq 'game.js?v=4.2.0' picture-drop/index.html
          grep -Fq 'jigsaw-drop-h5-v4.2.0' picture-drop/sw.js
          grep -Fq "blessings-v42').glob('*.webp')" picture-drop/tools/build_standalone.py

      - name: Run v4.2 multi-image album and hard-pack browser tests
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory picture-drop >/tmp/picture-drop-v42-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_v42.py

      - name: Preserve chain, planning and FLOW regressions
        run: |
          set -euo pipefail
          python -m http.server 8767 --directory picture-drop >/tmp/picture-drop-v38-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v38.py').read_text(encoding='utf-8')
          s=s.replace('8765','8767').replace('v=3.8.0','v=4.2.0')
          s=s.replace("[5,7,9,14,16]","[5,7,9,9,11]")
          Path('/tmp/smoke_v38_as_v42.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v38_as_v42.py

      - name: Preserve settle-before-clear and image-rotation regressions
        run: |
          set -euo pipefail
          python -m http.server 8768 --directory picture-drop >/tmp/picture-drop-v37-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v37.py').read_text(encoding='utf-8')
          s=s.replace('8765','8768').replace('v=3.7.0','v=4.2.0')
          s=s.replace("counts[15]==14 and counts[20]>=16 and counts[30]>=18","counts[15]==9 and counts[20]>=11 and counts[30]>=13")
          s=s.replace("stats['deck']>=25","stats['deck']>=8")
          Path('/tmp/smoke_v37_as_v42.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v37_as_v42.py

      - name: Preserve drag, joined-surface and gravity regressions
        run: |
          set -euo pipefail
          python -m http.server 8769 --directory picture-drop >/tmp/picture-drop-v36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v36.py').read_text(encoding='utf-8')
          s=s.replace('8765','8769').replace('v=3.6.0','v=4.2.0')
          Path('/tmp/smoke_v36_as_v42.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v36_as_v42.py

      - name: Rebuild offline and downloadable release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          grep -Fq "const V42_VERSION='4.2.0'" picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/webp;base64' picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop')
          (r/'release.json').write_text(json.dumps({
            'version':'4.2.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'whole blessing round now generates one shareable multi-image album instead of interrupting after every picture',
              'twelve new original photorealistic pictures added: six scenic blessings and six civilian helicopter photographs',
              'eighteen photorealistic blessing images organized into easy, medium, helicopter hard and expert-flow packs',
              'adaptive 1080x1440 album compositor supports four, six and eight completed pictures with pack-specific wishes',
              'pack chooser exposes picture count, grid size, theme and difficulty before play',
              'easy 4x4 pack, medium 5x5 deep-deck pack, six-helicopter similarity challenge and expert seeded three-chain pack',
              'difficulty-specific hint counts, starting FLOW, FLOW gain and cascade speed shape the tension-release rhythm',
              'individual completions only add to the collection counter; final album opens after the whole round',
              'v4.1 undo, explicit rescue, reliable next-card preview, improved hints and level-15 rebalance retained',
              'v4.0 photorealistic poster system, v3.8 chain/juice and seamless joined-surface rendering retained'
            ]
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v4.2.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*'
          ZIP_SIZE="$(stat -c%s /tmp/Jigsaw-Drop-H5-v4.2.zip)"
          echo "release zip bytes: $ZIP_SIZE"
          test "$ZIP_SIZE" -lt 150000000
          mv /tmp/Jigsaw-Drop-H5-v4.2.zip .

      - name: Commit v4.2 release
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m 'Release Jigsaw Drop H5 v4.2 multi-image blessing albums'
          git push origin HEAD:main
