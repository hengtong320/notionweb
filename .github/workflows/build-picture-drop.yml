name: Build Picture Drop H5 v3.8
on:
  push:
    paths:
      - 'picture-drop/tools/patch_v38_juice.py'
      - 'picture-drop/tools/patch_v38_chain3_fix.py'
      - 'picture-drop/tools/smoke_v38.py'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: picture-drop-build-v38, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply v3.8 chain and juice refactor
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.7.0'
          python picture-drop/tools/patch_v38_juice.py
          python picture-drop/tools/patch_v38_chain3_fix.py
          node --check picture-drop/game.js
          grep -Fq 'class JuiceDirector' picture-drop/game.js
          grep -Fq 'function predictCascade' picture-drop/game.js
          grep -Fq 'function registerClear' picture-drop/game.js
          grep -Fq 'chainSeed={depth' picture-drop/game.js
          grep -Fq 'feederCell=rcToIdx(0,anchor[1]+1)' picture-drop/game.js
          grep -Fq 'next-card' picture-drop/game.js
          grep -Fq 'juiceCanvas' picture-drop/index.html
          grep -Fq 'flowMeter' picture-drop/index.html
          grep -Fq '.juice-canvas{' picture-drop/style.css
          grep -Fq '.chain-predict-badge' picture-drop/style.css
          grep -Fq 'style.css?v=3.8.0' picture-drop/index.html
          grep -Fq 'game.js?v=3.8.0' picture-drop/index.html
          grep -Fq 'jigsaw-drop-h5-v3.8.0' picture-drop/sw.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.8.0'
      - name: Real browser v3.8 planning, chain and juice tests
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python -m http.server 8765 --directory picture-drop >/tmp/picture-drop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_v38.py
      - name: Preserve v3.7 progression and settle-first regressions
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory picture-drop >/tmp/picture-drop-http2.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v37.py').read_text(encoding='utf-8').replace('8765','8766').replace('v=3.7.0','v=3.8.0')
          Path('/tmp/smoke_v37_as_v38.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v37_as_v38.py
      - name: Preserve v3.6 drag, gravity and seamless-surface regressions
        run: |
          set -euo pipefail
          python -m http.server 8767 --directory picture-drop >/tmp/picture-drop-http3.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v36.py').read_text(encoding='utf-8').replace('8765','8767').replace('v=3.6.0','v=3.8.0')
          Path('/tmp/smoke_v36_as_v38.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v36_as_v38.py
      - name: Rebuild release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/webp;base64' picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/svg+xml;base64' picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'class JuiceDirector' picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop')
          (r/'release.json').write_text(json.dumps({
            'version':'3.8.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'next-card preview on every deck column',
              'seeded discoverable two-chain and three-chain setups',
              'drag-time cascade prediction badge',
              'three-layer merge/turn-chain/cross-move streak system',
              'five-tier escalating visual/audio/haptic feedback',
              'FLOW meter and three-turn FEVER acceleration',
              'pooled Canvas particles, rings and chain beams',
              'chain-dependent faster gravity and dealing',
              'level 3 two-chain and level 5 three-chain tutorials',
              'v3.7 progression, v3.6 gravity/seams and v3.5 anti-deadlock retained'
            ]
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop && zip -qr /tmp/Jigsaw-Drop-H5-v3.8.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*' && test "$(stat -c%s /tmp/Jigsaw-Drop-H5-v3.8.zip)" -lt 90000000 && mv /tmp/Jigsaw-Drop-H5-v3.8.zip .
      - name: Commit v3.8
        run: |
          set -euo pipefail
          git config user.name 'hengtong320';git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet;then exit 0;fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.8 chain planning and juice system'
          git push origin HEAD:main
