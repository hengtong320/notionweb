name: Build Picture Drop H5 v3.5.1
on:
  push:
    paths: ['picture-drop/tools/patch_v351_drag.py','picture-drop/tools/smoke_drag.py','.github/workflows/build-picture-drop.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: picture-drop-build-v351, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply drag hotfix and verify code
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.5.0'
          python picture-drop/tools/patch_v351_drag.py
          node --check picture-drop/game.js
          grep -Fq '.cell-layer,.fx-layer{pointer-events:none!important}' picture-drop/style.css
          grep -Fq '.tile{pointer-events:auto!important' picture-drop/style.css
          grep -Fq "style.css?v=3.5.1" picture-drop/index.html
          grep -Fq "game.js?v=3.5.1" picture-drop/index.html
          grep -Fq "jigsaw-drop-h5-v3.5.1" picture-drop/sw.js
          grep -Fq 'function ensureVisibleCompletionSet' picture-drop/game.js
          grep -Fq 'requestAnimationFrame(flushDragFrame)' picture-drop/game.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.5.1'
      - name: Real browser drag smoke test
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python -m http.server 8765 --directory picture-drop >/tmp/picture-drop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_drag.py
      - name: Rebuild release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          grep -Fq 'data:image/webp;base64' picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop');(r/'release.json').write_text(json.dumps({'version':'3.5.1','builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'features':['explicit tile-only pointer input layers','real Chromium drag regression test','v3.5 seamless joins','v3.5 anti-deadlock frontier','v3.5 smart hints','cache-busted service worker']},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop && zip -qr /tmp/Jigsaw-Drop-H5-v3.5.1.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*' && mv /tmp/Jigsaw-Drop-H5-v3.5.1.zip .
      - name: Commit v3.5.1
        run: |
          set -euo pipefail
          git config user.name 'hengtong320';git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet;then exit 0;fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.5.1 drag input hotfix'
          git push origin HEAD:main
