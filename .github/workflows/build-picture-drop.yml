name: Build Picture Drop H5 v4.1

on:
  push:
    paths:
      - 'picture-drop/tools/patch_v41_core.py'
      - 'picture-drop/tools/patch_v41_hotfix.py'
      - 'picture-drop/tools/smoke_v41.py'
      - 'picture-drop/tools/smoke_v41_generation.py'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v41
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v4.1 core experience refactor
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '4.0.0'
          python picture-drop/tools/patch_v41_core.py
          python picture-drop/tools/patch_v41_hotfix.py
          node --check picture-drop/game.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '4.1.0'
          grep -Fq "const V41_VERSION='4.1.0'" picture-drop/game.js
          grep -Fq 'generateBlessingLevelV41' picture-drop/game.js
          grep -Fq 'game.needsRescue=true' picture-drop/game.js
          grep -Fq 'undoLastMove' picture-drop/game.js
          grep -Fq 'hint-picture-preview' picture-drop/game.js
          grep -Fq 'configureGrid});' picture-drop/game.js
          grep -Fq '今日祝福' picture-drop/index.html
          grep -Fq 'id="undoBtn"' picture-drop/index.html
          grep -Fq 'id="blessingContinueBtn"' picture-drop/index.html
          grep -Fq 'style.css?v=4.1.0' picture-drop/index.html
          grep -Fq 'game.js?v=4.1.0' picture-drop/index.html
          grep -Fq 'jigsaw-drop-h5-v4.1.0' picture-drop/sw.js

      - name: Install browser test dependency
        run: python -m pip install --quiet selenium

      - name: Run v4.1 end-to-end browser tests
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory picture-drop >/tmp/picture-drop-v41-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_v41.py
          python picture-drop/tools/smoke_v41_generation.py

      - name: Preserve chain, planning and FLOW regressions
        run: |
          set -euo pipefail
          python -m http.server 8767 --directory picture-drop >/tmp/picture-drop-v38-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v38.py').read_text(encoding='utf-8')
          s=s.replace('8765','8767').replace('v=3.8.0','v=4.1.0')
          s=s.replace("[5,7,9,14,16]","[5,7,9,9,11]")
          Path('/tmp/smoke_v38_as_v41.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v38_as_v41.py

      - name: Preserve settle-before-clear and image rotation regressions
        run: |
          set -euo pipefail
          python -m http.server 8768 --directory picture-drop >/tmp/picture-drop-v37-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v37.py').read_text(encoding='utf-8')
          s=s.replace('8765','8768').replace('v=3.7.0','v=4.1.0')
          s=s.replace("counts[15]==14 and counts[20]>=16 and counts[30]>=18","counts[15]==9 and counts[20]>=11 and counts[30]>=13")
          s=s.replace("stats['deck']>=25","stats['deck']>=8")
          Path('/tmp/smoke_v37_as_v41.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v37_as_v41.py

      - name: Preserve drag, joined-surface and gravity regressions
        run: |
          set -euo pipefail
          python -m http.server 8769 --directory picture-drop >/tmp/picture-drop-v36-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          from pathlib import Path
          s=Path('picture-drop/tools/smoke_v36.py').read_text(encoding='utf-8')
          s=s.replace('8765','8769').replace('v=3.6.0','v=4.1.0')
          Path('/tmp/smoke_v36_as_v41.py').write_text(s,encoding='utf-8')
          PY
          sleep 1
          python /tmp/smoke_v36_as_v41.py

      - name: Rebuild offline and downloadable release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          grep -Fq "const V41_VERSION='4.1.0'" picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop')
          (r/'release.json').write_text(json.dumps({
            'version':'4.1.0',
            'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'features':[
              'Blessing mode split into three real two-image packs with no repeated fake next group',
              'first blessing work can be completed in one move and immediately opens the generated poster',
              'support-aware group gravity: rigid fall first, controlled fracture only when asymmetrically pinned',
              'runtime deck preview is trustworthy; silent deck-front reordering removed',
              'deadlocks are surfaced and repaired only by an explicit free magic-wand rescue',
              'one-step undo restores board, decks, counters and collected blessing state',
              'stronger hints include complete-image preview, dimmed unrelated pieces, ghost target and action label',
              'level 15 rebalanced from 14 to 9 images while retaining the 5x5 planning board',
              'blessing mode hides competitive clutter and uses a dedicated work-first completion flow',
              'local action telemetry and JSON export added for playtest diagnosis',
              'v4.0 photorealistic Scheme B, poster sharing, chain, FLOW, seamless surfaces and performance work retained'
            ]
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v4.1.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*'
          ZIP_SIZE="$(stat -c%s /tmp/Jigsaw-Drop-H5-v4.1.zip)"
          echo "release zip bytes: $ZIP_SIZE"
          test "$ZIP_SIZE" -lt 120000000
          mv /tmp/Jigsaw-Drop-H5-v4.1.zip .

      - name: Commit v4.1 release
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m 'Release Jigsaw Drop H5 v4.1 core experience refactor'
          git push origin HEAD:main
