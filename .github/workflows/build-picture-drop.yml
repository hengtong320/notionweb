name: Build Picture Drop H5 v3.5
on:
  push:
    paths: ['picture-drop/tools/patch_v35_playability.py','.github/workflows/build-picture-drop.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: picture-drop-build-v35, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply v3.5 and verify core invariants
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.4.0'
          python picture-drop/tools/patch_v35_playability.py
          node --check picture-drop/game.js
          grep -q "background-origin:border-box" picture-drop/style.css
          grep -q "function ensureVisibleCompletionSet" picture-drop/game.js
          grep -q "function primeDecksForPlayableFrontier" picture-drop/game.js
          grep -q "function visibleCompletionImage" picture-drop/game.js
          grep -q "function findHelpfulMove" picture-drop/game.js
          grep -q "hint-target-frame" picture-drop/style.css
          grep -q "style.css?v=3.5.0" picture-drop/index.html
          grep -q "jigsaw-drop-h5-v3.5.0" picture-drop/sw.js
          grep -q "requestAnimationFrame(flushDragFrame)" picture-drop/game.js
          grep -q "const moved=await applyGravity();" picture-drop/game.js
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.5.0'
      - name: Verify anti-deadlock model
        run: |
          node - <<'JS'
          // Model the invariant v3.5 enforces: every full play frontier must expose
          // all four quarters of at least one uncleared image; hidden quarters may
          // be swapped with board tiles while preserving total piece identity.
          function ensure(board,decks,tiles){
            const state=new Map();board.forEach(id=>{if(!id)return;const t=tiles[id];const s=state.get(t.img)||new Set();s.add(t.q);state.set(t.img,s)});
            if([...state.values()].some(s=>s.size===4))return true;
            const imgs=[...new Set(Object.values(tiles).map(t=>t.img))];
            const locate=id=>{for(let c=0;c<decks.length;c++){const p=decks[c].indexOf(id);if(p>=0)return[c,p]}return null};
            for(const img of imgs){const ids=[0,1,2,3].map(q=>Object.keys(tiles).find(id=>tiles[id].img===img&&tiles[id].q===q));const missing=ids.filter(id=>!board.includes(id));if(!missing.length||missing.some(id=>!locate(id)))continue;const protectedSet=new Set(ids.filter(id=>board.includes(id)));const cells=board.map((id,i)=>[id,i]).filter(([id])=>id&&!protectedSet.has(id)).map(x=>x[1]);if(cells.length<missing.length)continue;for(const id of missing){const [c,p]=locate(id),cell=cells.shift(),old=board[cell];board[cell]=id;decks[c][p]=old}return [0,1,2,3].every(q=>board.some(id=>id&&tiles[id].img===img&&tiles[id].q===q));}return false}
          for(let trial=0;trial<200;trial++){
            const tiles={},ids=[];for(let img=0;img<12;img++)for(let q=0;q<4;q++){const id=`${img}-${q}`;tiles[id]={img,q};ids.push(id)}
            ids.sort(()=>Math.random()-.5);const board=ids.slice(0,25),rest=ids.slice(25),decks=[[],[],[],[],[]];rest.forEach((id,i)=>decks[i%5].push(id));
            if(!ensure(board,decks,tiles))throw new Error('frontier invariant failed');
            const all=[...board,...decks.flat()].sort();if(all.join('|')!==ids.slice().sort().join('|'))throw new Error('tile integrity changed');
          }
          console.log('anti-deadlock frontier model passed x200');
          JS
      - name: Rebuild release
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          r=Path('picture-drop');(r/'release.json').write_text(json.dumps({'version':'3.5.0','builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'features':['cache-busted fresh JS/CSS and network-first service worker','border-box image sampling for truly seamless joins','no underlying cell borders at joined seams','guaranteed visible completion frontier','smart hidden-deck priming after every clear','target-oriented hint with final 2x2 frame','free rescue never consumes hint charge','v3.2 RAF performance retained']},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop && zip -qr /tmp/Jigsaw-Drop-H5-v3.5.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*' && test "$(stat -c%s /tmp/Jigsaw-Drop-H5-v3.5.zip)" -lt 90000000 && mv /tmp/Jigsaw-Drop-H5-v3.5.zip .
      - name: Commit v3.5
        run: |
          set -euo pipefail
          git config user.name 'hengtong320';git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet;then exit 0;fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.5 seamless joins, strong hints and guaranteed playability'
          git push origin HEAD:main
