name: Build Picture Drop H5 v3.2

on:
  push:
    paths:
      - 'picture-drop/tools/patch_v32_performance.py'
      - 'picture-drop/tools/verify_v32.js'
      - '.github/workflows/build-picture-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-drop-build-v32
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v3.2 performance refactor
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < picture-drop/VERSION)" = '3.1.1'
          python picture-drop/tools/patch_v32_performance.py
          node --check picture-drop/game.js
          node picture-drop/tools/verify_v32.js

      - name: Rebuild offline edition
        shell: bash
        run: |
          set -euo pipefail
          python picture-drop/tools/build_standalone.py
          test -s picture-drop/Jigsaw-Drop-offline.html
          cp picture-drop/Jigsaw-Drop-offline.html picture-drop/Jigsaw-Drop-单文件离线版.html

      - name: Build clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f picture-drop/Jigsaw-Drop-H5-*.zip
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          root=Path('picture-drop')
          payload={'version':'3.2.0','builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'features':['requestAnimationFrame drag rendering','removed forced synchronous reflow','double-RAF FLIP transitions','cached active tile/index lookups','GPU layer containment','lighter mobile drag effects','portrait physics and split/group rules preserved']}
          (root/'release.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd picture-drop
          zip -qr /tmp/Jigsaw-Drop-H5-v3.2.zip . -x 'Jigsaw-Drop-H5-*.zip' '.git/*'
          test "$(stat -c%s /tmp/Jigsaw-Drop-H5-v3.2.zip)" -lt 90000000
          mv /tmp/Jigsaw-Drop-H5-v3.2.zip .

      - name: Commit v3.2 game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add -A picture-drop
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m 'Release Jigsaw Drop H5 v3.2 performance refactor'
          git push origin HEAD:main
