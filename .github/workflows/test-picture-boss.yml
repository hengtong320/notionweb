name: Test Jigsaw Drop BOSS H5 prototype

on:
  push:
    paths:
      - 'picture-drop/boss.html'
      - 'picture-drop/boss.css'
      - 'picture-drop/boss.js'
      - 'picture-drop/tools/smoke_boss.py'
      - '.github/workflows/test-picture-boss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install --quiet selenium
      - name: Validate JavaScript syntax
        run: node --check picture-drop/boss.js
      - name: Run real browser smoke test
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory picture-drop >/tmp/boss-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_boss.py
