name: Build organ and surface candidate
on:
  push:
    paths:
      - '.github/workflows/atlas-11-candidate.yml'
      - 'atlas-systems-11/corrections.py'
      - 'atlas-systems-11/review-*.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-11-candidate
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_PATH: /tmp/atlas11/node_modules
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksummed application source
        run: |
          python - <<'PY'
          import base64,gzip,json,hashlib
          from pathlib import Path
          p=Path('atlas-systems-11')
          names=['source.part0','source.part1','source.part2','source.part3a','source.part3b','source.part4a','source.part4b','source.part5a','source.part5b']
          text=''.join((p/n).read_text().strip() for n in names)
          data=gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(data).hexdigest()=='98407b9e38e7cad396d991775e6da4efe3d0a8b2bd631313b035c4946b4c09b4','Source transfer checksum mismatch'
          files=json.loads(data)
          assert set(files)=={'prepare.py','patch.py','tissue-methods.js','surface-v11.js','learning-surface.js','compile.cjs','verify.cjs'}
          for n,c in files.items():(p/n).write_text(c)
          print('SOURCE_OK',len(data))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: atlas-11-surface-ready
          run-id: 35986863094
          github-token: ${{ github.token }}
          path: atlas-systems-11/source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build and real-browser tools
        run: |
          npm install --prefix /tmp/atlas11 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          python -m pip install numpy
          /tmp/atlas11/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build guarded additions to the unchanged approved viewer
        run: |
          python atlas-systems-11/patch.py
          python atlas-systems-11/prepare.py
          if test -f atlas-systems-11/corrections.py; then python atlas-systems-11/corrections.py; fi
          for f in atlas-systems-11/review-*.py; do test ! -f "$f" || python "$f"; done
          node --check fullbody-tcm-v11/tissues-v4.js
          node --check fullbody-tcm-v11/learning-enhancements.js
          node atlas-systems-11/compile.cjs
          test -z "$(git diff HEAD -- fullbody-tcm-v9/ fullbody-tcm-v10/ fullbody-tcm-v10-1/ anatomy/)"
      - name: Chromium actual organ and body-surface interactions
        run: node atlas-systems-11/verify.cjs
      - name: WebKit actual organ and body-surface interactions
        env:
          BROWSER: webkit
        run: node atlas-systems-11/verify.cjs
      - name: Export candidate, raw provenance, screenshots and real test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-11-candidate
          path: |
            fullbody-tcm-v11/
            atlas-systems-11/*.py
            atlas-systems-11/*.js
            atlas-systems-11/*.cjs
          retention-days: 14
