name: Test hierarchical synthesis H5

on:
  push:
    paths:
      - 'picture-drop/synthesis.html'
      - 'picture-drop/synthesis.css'
      - 'picture-drop/synthesis.js'
      - 'picture-drop/tools/smoke_synthesis.py'
      - 'picture-drop/tools/patch_synthesis_entry.py'
      - '.github/workflows/test-picture-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picture-synthesis-h5
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependency
        run: python -m pip install --quiet selenium
      - name: Apply homepage entry
        run: |
          set -euo pipefail
          python picture-drop/tools/patch_synthesis_entry.py
          grep -Fq 'synthesis.html?v=2.0.0' picture-drop/index.html
          grep -Fq '层级合成 · 新版试玩' picture-drop/index.html
      - name: Validate JavaScript syntax
        run: node --check picture-drop/synthesis.js
      - name: Run browser regression
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory picture-drop >/tmp/synthesis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python picture-drop/tools/smoke_synthesis.py
      - name: Build downloadable H5 package
        run: |
          set -euo pipefail
          rm -f picture-drop/Jigsaw-Hierarchical-Synthesis-v2.zip
          cd picture-drop
          zip -qr /tmp/Jigsaw-Hierarchical-Synthesis-v2.zip \
            synthesis.html synthesis.css synthesis.js \
            assets/pictures-portrait/30-library.webp
          mv /tmp/Jigsaw-Hierarchical-Synthesis-v2.zip .
          test -s Jigsaw-Hierarchical-Synthesis-v2.zip
      - name: Commit homepage and generated package
        run: |
          set -euo pipefail
          git config user.name 'hengtong320'
          git config user.email '564712388@qq.com'
          git add picture-drop/index.html picture-drop/Jigsaw-Hierarchical-Synthesis-v2.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m 'Release hierarchical synthesis H5 v2'
          git push origin HEAD:main
