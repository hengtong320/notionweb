name: Verify V20 body scene transactions
on:
  push:
    paths: ['atlas20-repair/**', '.github/workflows/atlas20-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: atlas20-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {NODE_PATH: /tmp/a20/node_modules}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble isolated candidate
        run: |
          test ! -d fullbody-tcm-v20
          python atlas20-repair/patch.py
          if test -f atlas20-repair/finalize.py; then python atlas20-repair/finalize.py; fi
      - name: Install pinned graphics and real browsers
        run: |
          npm install --prefix /tmp/a20 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1 pngjs@7.0.0
          /tmp/a20/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build current source and record hashes
        id: build
        run: |
          rm -f fullbody-tcm-v20/app.bundle.js
          node -e "require('esbuild').buildSync({entryPoints:['fullbody-tcm-v20/app.js'],outfile:'fullbody-tcm-v20/app.bundle.js',nodePaths:['/tmp/a20/node_modules'],bundle:true,format:'iife',loader:{'.txt':'text'},minify:true})"
          node --check atlas20-repair/verify.cjs
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('fullbody-tcm-v20')
          hashes={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}
          for name in ['point-registration-v18.json','point-rules-v18.js','body-frame-v18.js','skin-v17.js','skin-ink-v19.js']:
              assert (p/name).read_bytes()==(Path('fullbody-tcm-v19')/name).read_bytes(),name
          (p/'build-info.json').write_text(json.dumps({'version':'20.0.0','sourceCommit':os.environ['GITHUB_SHA'],'verificationRun':os.environ['GITHUB_RUN_ID'],'sha256':hashes,'pointRegistrationUnchanged':True,'clinicalCalibration':False},indent=2))
          PY
          test -z "$(git diff -- fullbody-tcm-v19/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Record V19 baseline defects
        env: {BASELINE: 'true'}
        run: node atlas20-repair/verify.cjs
      - name: Chromium complete scene transactions
        run: node atlas20-repair/verify.cjs
      - name: WebKit complete scene transactions
        if: '!cancelled() && steps.build.outcome == ''success'''
        env: {BROWSER: webkit}
        run: node atlas20-repair/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas20-candidate
          path: |
            fullbody-tcm-v20/
            atlas20-repair/
          retention-days: 14
