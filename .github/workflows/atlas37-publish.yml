name: Publish V37 posture research preview
on:
  push:
    paths:
      - 'atlas37-tools/**'
      - '.github/workflows/atlas37-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas37-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas37-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas37-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas37-build/node_modules node atlas37-tools/build.cjs
          node --check fullbody-tcm-v37/app.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: 07a89bfa5cc5ce111b41d193dfdff85baa3ff3555083524597283fb4f14b236e
          EXPECTED_POSE: 0870281ed48a9f18300c59d062a3fe4d1ccfd97226810bb3afc5de0b85fd9edf
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v37')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          for name,sha in json.loads((d/'build-info.json').read_text())['files'].items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v36' in s or 'fullbody-tcm-v37' in s
          p.write_text(s.replace('fullbody-tcm-v36','fullbody-tcm-v37').replace('36.0.0','37.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v36 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v37 anatomy/index.html
          git commit -m "Publish V37 posture stages and explicit load assumptions"
          git push origin HEAD:main
