name: Anatomy surface regression
on:
  push:
    paths:
      - '.github/workflows/anatomy-surface-regression.yml'
      - 'scripts/anatomy-surface/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anatomy-surface-regression
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_PATH: /tmp/a17/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore existing candidate sources
        run: |
          python - <<'PY'
          import json,gzip,base64
          from pathlib import Path
          p=Path('atlas17-delivery')
          parts=''.join((p/('payload.%02d'%i)).read_text() for i in range(4))
          assert len(parts)==16368
          obj=json.loads(gzip.decompress(base64.b64decode(parts)))
          for name,content in obj.items():
              assert '/' not in name
              (p/name).write_text(content)
          PY
          python atlas17-delivery/fixes.py
      - name: Install pinned graphics and browser dependencies
        run: |
          npm install --prefix /tmp/a17 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          /tmp/a17/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build repaired candidate and preserve original anatomy
        run: |
          python atlas17-delivery/patch.py
          python scripts/anatomy-surface/finish.py
          node atlas17-delivery/build.cjs
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('fullbody-tcm-v17/build-info.json')
          data=json.loads(p.read_text())
          data.update(version='17.0.1',sourceCommit=os.environ['GITHUB_SHA'],verificationRun=os.environ['GITHUB_RUN_ID'])
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          test -z "$(git diff HEAD -- fullbody-tcm-v16/ anatomy/ fullbody-tcm-v9/assets/ fullbody-tcm-v11/assets/ fullbody-tcm-v12/assets/)"
      - name: Chromium actual skin and switching journey
        run: node atlas17-delivery/verify.cjs
      - name: WebKit actual skin and switching journey
        if: '!cancelled()'
        env:
          BROWSER: webkit
        run: node atlas17-delivery/verify.cjs
      - name: Candidate, source, screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-surface-v17-verified
          path: |
            fullbody-tcm-v17/
            atlas17-delivery/
            scripts/anatomy-surface/
          retention-days: 14
