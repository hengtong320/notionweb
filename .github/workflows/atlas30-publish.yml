name: Publish verified skin contact repair
on:
  push:
    paths: ['.github/workflows/atlas30-publish.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: atlas30-publish
  cancel-in-progress: false
env:
  CANDIDATE_RUN: '36979299044'
  CANDIDATE_SHA: '498438a151264343b1835d16c674aeaa90eaf5db'
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Require the exact candidate run to finish successfully
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import urllib.request,json,os,time
          url='https://api.github.com/repos/hengtong320/notionweb/actions/runs/'+os.environ['CANDIDATE_RUN']
          for i in range(40):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              r=json.load(urllib.request.urlopen(req,timeout=30))
              assert r['head_sha']==os.environ['CANDIDATE_SHA']
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  break
              if i==39:raise TimeoutError('Candidate did not finish')
              print('Waiting for exact candidate:',r['status'],flush=True)
              time.sleep(15)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: atlas30-chromium
          run-id: 36979299044
          github-token: ${{ github.token }}
          path: /tmp/atlas30-chromium
      - uses: actions/download-artifact@v4
        with:
          name: atlas30-webkit
          run-id: 36979299044
          github-token: ${{ github.token }}
          path: /tmp/atlas30-webkit
      - name: Promote identical tested code and separate evidence
        run: |
          python atlas30-publish/publish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v30 atlas30-publish
          git commit -m 'Publish V30 verified skin-contact points and preserved sex-switch state'
          git push origin HEAD:main
  public:
    needs: publish
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/a30/node_modules
      BROWSER: ${{ matrix.browser }}
      ATLAS_VERSION: '30'
      TEST_URL: https://hengtong320.github.io/notionweb/anatomy/?v=30.0.0
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the same browser and pixel test dependencies
        run: |
          npm install --prefix /tmp/a30 playwright@1.56.1 pngjs@7.0.0
          /tmp/a30/node_modules/.bin/playwright install --with-deps $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for reviewed entrance activation and verify public file hashes
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,time,os
          from pathlib import Path
          b=json.loads(Path('fullbody-tcm-v30/build-info.json').read_text())
          names=['app.bundle.js','meridian-ux-v26.css','reading-v26.css']
          root='https://hengtong320.github.io/notionweb/'
          for attempt in range(48):
              try:
                  def get(name):
                      req=urllib.request.Request(root+name+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      return urllib.request.urlopen(req,timeout=30).read()
                  assert '../fullbody-tcm-v30/' in get('anatomy/').decode(),'Entrance has not been activated'
                  hashes={n:hashlib.sha256(get('fullbody-tcm-v30/'+n)).hexdigest() for n in names}
                  assert all(hashes[n]==b['files'][n] for n in names),'Public bundle or CSS differs'
                  Path('atlas30-evidence').mkdir(exist_ok=True)
                  Path('atlas30-evidence/live-content-'+os.environ['BROWSER']+'.json').write_text(json.dumps({'success':True,'version':'30.0.0','hashes':hashes,'checkedAt':time.time()},indent=2))
                  break
              except Exception as e:
                  print('Public deployment not ready:',str(e),flush=True)
                  if attempt==47:raise
                  time.sleep(10)
          PY
      - name: Public skin-contact, pixel and state tests
        run: node atlas30-publish/verified-tests/probe.cjs
      - name: Public 44 point and route switching tests
        if: '!cancelled()'
        run: node atlas30-publish/verified-tests/prior-surface-regression.cjs
      - name: Public 28 observation tests
        if: '!cancelled()'
        run: node atlas30-publish/verified-tests/prior-observation-regression.cjs
      - name: Public 14 opaque-skin state tests
        if: '!cancelled()'
        run: node atlas30-publish/verified-tests/prior-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas30-public-${{ matrix.browser }}
          path: |
            atlas30-evidence/live-*
            atlas29-evidence/live-*
            fullbody-tcm-v30/checks/*live*
          retention-days: 14
