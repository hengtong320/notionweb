name: Verify V16 tablet and anatomical context
on:
  push:
    paths:
      - 'atlas16-delivery/**'
      - '.github/workflows/atlas16-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas16-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      NODE_PATH: /tmp/atlas16/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned renderer and actual browser engines
        run: |
          npm install --prefix /tmp/atlas16 three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10 playwright@1.56.1
          /tmp/atlas16/node_modules/.bin/playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Build only V16 and preserve previous releases
        run: |
          python atlas16-delivery/patch.py
          python atlas16-delivery/refine.py
          python atlas16-delivery/hand-surface-review.py
          for f in fullbody-tcm-v16/{app,view-v16,female-v12,tissues-v4,shared-v14,surface-v13}.js; do node --check "$f"; done
          node atlas16-delivery/build.cjs
          test -z "$(git diff HEAD -- fullbody-tcm-v9/ fullbody-tcm-v11/ fullbody-tcm-v12/ fullbody-tcm-v14/ fullbody-tcm-v15/ anatomy/)"
          python - <<'PY'
          from pathlib import Path
          import json
          a=Path('fullbody-tcm-v15/navigation-points-v6.js').read_text().split('export const NAVIGATION_POINTS=',1)[1].strip().rstrip(';')
          b=Path('fullbody-tcm-v16/navigation-points-v6.js').read_text().split('export const NAVIGATION_POINTS=',1)[1].strip().rstrip(';')
          aa={r['code']:r for r in json.loads(a)};bb={r['code']:r for r in json.loads(b)}
          assert aa.keys()==bb.keys()
          assert all(aa[k]==bb[k] for k in aa if k!='LI4')
          print('Only LI4 navigation reference changed; other points retained')
          PY
      - name: Chromium tablet touch and complete learning journey
        run: node atlas16-delivery/verify.cjs
      - name: WebKit tablet layout and complete learning journey
        env:
          BROWSER: webkit
        run: node atlas16-delivery/verify.cjs
      - name: Export actual rendered candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas16-candidate
          path: |
            fullbody-tcm-v16/
            atlas16-delivery/
          retention-days: 14
