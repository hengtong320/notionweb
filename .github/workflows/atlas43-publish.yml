name: Publish V43 eight static posture corrections
on:
  push:
    paths:
      - 'atlas43-tools/**'
      - '.github/workflows/atlas43-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas43-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare reviewed sources
        run: |
          python3 atlas43-tools/prepare.py
      - name: Build and validate data
        run: |
          npm install --prefix /tmp/atlas43-build --no-audit --no-fund three@0.180.0 three-mesh-bvh@0.9.2 esbuild@0.25.10
          NODE_PATH=/tmp/atlas43-build/node_modules node atlas43-tools/build.cjs
          node --check fullbody-tcm-v43/app.bundle.js
          node --check fullbody-tcm-v43/pose.bundle.js
      - name: Match reviewed local build
        env:
          EXPECTED_BUNDLE: c9f14a4039aed73482c242d71af00e96d8d3a6db23a2d168f9efb35552f9793d
          EXPECTED_POSE: c2c973488160b671857ddccd204f991f1f47c463feeec54c8b7cddffbe842d08
          EXPECTED_EVIDENCE: d616f4a218f33e5cbdc5fb03a3e7d4089830c6fca80b0851e85a8ad76754459d
        run: |
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os
          d=pathlib.Path('fullbody-tcm-v43')
          for name,key in [('app.bundle.js','EXPECTED_BUNDLE'),('evidence.bundle.js','EXPECTED_EVIDENCE'),('pose.bundle.js','EXPECTED_POSE')]:
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==os.environ[key],name
          for name,sha in json.loads((d/'build-info.json').read_text())['files'].items():
            assert hashlib.sha256((d/name).read_bytes()).hexdigest()==sha,name
          p=pathlib.Path('anatomy/index.html');s=p.read_text()
          assert 'fullbody-tcm-v42' in s or 'fullbody-tcm-v43' in s
          p.write_text(s.replace('fullbody-tcm-v42','fullbody-tcm-v43').replace('42.0.0','43.0.0'))
          PYCODE
          git diff --exit-code -- fullbody-tcm-v42 fullbody-tcm-v41 fullbody-tcm-v40 fullbody-tcm-v34 fullbody-tcm-v31 fullbody-tcm-v9 fullbody-tcm-v11 fullbody-tcm-v12
      - name: Publish version and fixed entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v43 anatomy/index.html
          git diff --cached --quiet || git commit -m "Publish V43 grounded hinge, reach and tree reference poses"
          git push origin HEAD:main
