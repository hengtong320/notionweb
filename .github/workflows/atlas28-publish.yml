name: Publish verified V28 surface consistency
on:
  push:
    paths: ['.github/workflows/atlas28-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: atlas28-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_RUN: '36903496589'
      CANDIDATE_SHA: a73a54c21ceaf96caa8057aacf43d3586ed970c3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Require both candidate browser journeys to finish successfully
        run: |
          python - <<'PY'
          import urllib.request,json,os,time
          url='https://api.github.com/repos/hengtong320/notionweb/actions/runs/'+os.environ['CANDIDATE_RUN']
          for attempt in range(90):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              d=json.load(urllib.request.urlopen(req,timeout=30))
              assert d['head_sha']==os.environ['CANDIDATE_SHA']
              if d['status']=='completed':
                  assert d['conclusion']=='success',d['conclusion']
                  break
              if attempt==89:raise TimeoutError('Candidate not completed')
              time.sleep(10)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: atlas28-chromium
          run-id: 36903496589
          github-token: ${{ github.token }}
          path: /tmp/atlas28-chromium
      - uses: actions/download-artifact@v4
        with:
          name: atlas28-webkit
          run-id: 36903496589
          github-token: ${{ github.token }}
          path: /tmp/atlas28-webkit
      - name: Publish only identical verified source, runtime and reports
        run: |
          git pull --ff-only origin main
          python atlas28-publish/publish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fullbody-tcm-v28 atlas28-publish/verified-tests
          git commit -m "Publish V28 verified opaque-skin point and route consistency"
          git push origin HEAD:main
  public:
    needs: publish
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, webkit]}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_PATH: /tmp/a28/node_modules
      BROWSER: ${{ matrix.browser }}
      TEST_URL: https://hengtong320.github.io/notionweb/anatomy/?v=28.0.0
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install identical test tools without audit requests
        timeout-minutes: 3
        run: npm install --prefix /tmp/a28 --no-audit --no-fund --fetch-retries=1 --fetch-timeout=45000 playwright@1.56.1 pngjs@7.0.0
      - name: Prepare native browser libraries with bounded network waits
        timeout-minutes: 4
        run: |
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-atlas-network-timeouts >/dev/null
          /tmp/a28/node_modules/.bin/playwright install-deps $BROWSER
      - name: Download the exact browser and prepare Chinese text
        timeout-minutes: 4
        env: {PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '45000'}
        run: |
          /tmp/a28/node_modules/.bin/playwright install $BROWSER
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify activated entrance and public code matches the tested bytes
        run: |
          python - <<'PY'
          import urllib.request,json,time,hashlib,os
          from pathlib import Path
          p=Path('fullbody-tcm-v28')
          b=json.loads((p/'build-info.json').read_text())
          base='https://hengtong320.github.io/notionweb/'
          for attempt in range(60):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      return urllib.request.urlopen(req,timeout=30).read()
                  assert '../fullbody-tcm-v28/' in get('anatomy/').decode(),'Entrance awaiting activation'
                  checked={}
                  for name in ['app.bundle.js','reading-v26.css','meridian-ux-v26.css']:
                      digest=hashlib.sha256(get('fullbody-tcm-v28/'+name)).hexdigest()
                      assert digest==b['files'][name],name
                      checked[name]=digest
                  (p/'checks'/('live-content-'+os.environ['BROWSER']+'.json')).write_text(json.dumps({'success':True,'entryVersion':'28.0.0','files':checked,'checkedAt':time.time()},indent=2))
                  break
              except Exception as e:
                  print(e,flush=True)
                  if attempt==59:raise
                  time.sleep(10)
          PY
      - name: Public opaque skin, counterpart point and route consistency
        run: node atlas28-publish/verified-tests/verify.cjs
      - name: Public observation and label regression
        run: node atlas28-publish/verified-tests/observation.cjs
      - name: Public skin strokes, skeleton and phone reading regression
        run: node atlas28-publish/verified-tests/prior.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas28-public-${{ matrix.browser }}
          path: |
            fullbody-tcm-v28/checks/live-*
            fullbody-tcm-v28/checks/observation-live-*
            fullbody-tcm-v28/checks/prior-live-*
          retention-days: 14
